<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi rendimiento">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mi rendimiento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caladea:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Concepto: panel de control sobre cuadrícula tenue. Midnight / Ice White de fondo. Victory Blue #3B82F6 fijo en títulos y botones (claro u oscuro). Rojo, verde, naranja y morado solo con significado. */
:root{
  --bg:#111827;--bg2:#0B1220;--bg3:#172033;--line:#374151;
  --tx:#F9FAFB;--tx2:#D1D5DB;--mut:#9CA3AF;
  --ac:#3B82F6;--act:#3B82F6;--acs:rgba(59,130,246,.18);
  --red:#EF4444;--grn:#22C55E;--org:#F59E0B;--pur:#A855F7;
  --lv1:var(--red);--lv2:var(--ac);--lv3:var(--org);--onlv:#FFFFFF;--onred:#FFFFFF;
  --grid:rgba(55,65,81,.35);--sh:0 12px 28px -16px rgba(0,0,0,.7);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Cambria,Caladea,Georgia,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F9FAFB;--bg2:#FFFFFF;--bg3:#F1F5F9;--line:#D1D5DB;
    --tx:#111827;--tx2:#374151;--mut:#4B5563;--acs:rgba(59,130,246,.12);
    --grid:rgba(17,24,39,.06);--sh:0 12px 28px -18px rgba(17,24,39,.35);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F9FAFB;--bg2:#FFFFFF;--bg3:#F1F5F9;--line:#D1D5DB;
  --tx:#111827;--tx2:#374151;--mut:#4B5563;--acs:rgba(59,130,246,.12);
  --grid:rgba(17,24,39,.06);--sh:0 12px 28px -18px rgba(17,24,39,.35);color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background-color:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px;
  padding-block:14px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:680px;margin-inline:auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
h1,h2,h3,p{margin:0}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.eyebrow:not(.m)::before{content:"";flex:none;width:16px;height:3px;border-radius:2px;background:var(--ac)}
.eyebrow.m{color:var(--mut)}
.big{font-size:38px;line-height:1.02;font-weight:800;letter-spacing:-.03em;text-transform:uppercase;margin-top:8px;color:var(--ac)}
.big::after{content:"";display:block;width:48px;height:4px;border-radius:2px;background:var(--ac);margin-top:16px}
.big span{display:block;font-size:15px;letter-spacing:.02em;color:var(--mut);font-weight:600;text-transform:none;margin-top:8px}
.h2{font-size:24px;line-height:1.1;font-weight:800;letter-spacing:-.025em;margin-top:6px;color:var(--ac)}
.sec{margin-top:34px}
.lede{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--tx2);margin-top:8px;max-width:60ch}
.sm{font-size:13px}.mut{color:var(--mut)}
.tab{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px;padding-bottom:18px}
.who{display:flex;align-items:center;gap:12px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left;border-radius:14px}
.who .tx{min-width:0;display:grid;gap:1px}
.who .g{font-size:13px;font-weight:600;color:var(--mut);line-height:1.25}
.who .n{color:var(--ac);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .n.ask{font-size:16px;color:var(--act);text-decoration:underline;text-underline-offset:3px}
.av{display:grid;place-items:center;flex:none;border-radius:50%;border:2px solid var(--ac);overflow:hidden;background:#0B1220;color:#F9FAFB;font-weight:800}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.gear{position:relative}
.gear .dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--grn);border:2px solid var(--bg3)}
.gear .dot.off{background:var(--org)}
.avs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.avp{background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:12px 6px;display:grid;justify-items:center;gap:8px;min-height:44px}
.avp.on{border-color:var(--ac);background:var(--bg3)}
.avp .sm{font-weight:600;text-align:center}
.avp.on .sm{font-weight:800}
.ck svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--act)}
.acct{display:grid;gap:14px}
.acct .r2{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acct .r2+.r2{border-top:1px solid var(--line);padding-top:14px}
.acct b{font-weight:800}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--ac);color:#fff;font-weight:800;min-height:44px;box-shadow:0 10px 20px -12px var(--ac)}
.btn.g{box-shadow:none}
.btn.g{background:var(--bg3);color:var(--tx);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;padding:10px 0;font-size:13px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-block;font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;color:var(--onlv);white-space:nowrap}
.pill.l1{background:var(--lv1)}.pill.l2{background:var(--lv2)}.pill.l3{background:var(--lv3)}
.chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.act{color:var(--act);border-color:var(--ac)}
.meter{display:flex;gap:6px;margin-top:18px}
.meter i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.banner{margin-top:18px;border:1px solid var(--ac);border-radius:20px;padding:18px;background:var(--bg2);display:grid;gap:10px}
.banner b{font-weight:800;font-size:18px;letter-spacing:-.01em}
.hab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hab:first-of-type{border-top:0}
.hab span{font-weight:700}
.yn{display:flex;gap:8px}
.yb{width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--mut);display:grid;place-items:center}
.yb.on.ok{background:var(--grn);border-color:var(--grn);color:var(--onlv)}
.yb.on.no{background:var(--red);border-color:var(--red);color:var(--onred)}
.seg{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 10px;min-height:40px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--ac);color:#fff}
.blk{display:grid;gap:10px}
.blk .n{font-weight:800;font-size:17px;letter-spacing:-.01em}
.blk .r{color:var(--mut);font-size:13px}
.del{background:none;border:0;color:var(--red);font-weight:700;font-size:13px;padding:10px 0 10px 10px;min-height:44px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg2);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav div{max-width:680px;margin:auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:none;min-height:46px;border-radius:12px;font-weight:700;font-size:13px;color:var(--mut)}
.nav button.on{background:var(--acs);color:var(--act)}
.nav button{position:relative}
.nav button.on::after{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.nav button{display:grid;place-items:center}
.nav button svg{width:26px;height:26px}
.tools{display:flex;gap:8px;align-items:center}
.sw{position:relative;width:68px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg3);padding:0;flex:none}
.sw .k{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;background:var(--ac);transition:transform .2s}
.sw[aria-checked="true"] .k{transform:translateX(28px)}
.sw svg{position:absolute;top:11px;width:16px;height:16px;color:var(--mut)}
.sw .s1{left:11px}.sw .s2{left:39px}
.sw[aria-checked="false"] .s1,.sw[aria-checked="true"] .s2{color:#fff}
.ib2{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);display:grid;place-items:center;flex:none}
.arow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.ar{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:8px 2px;min-height:58px;display:grid;place-items:center;text-align:center}
.ar b{font-weight:800;font-size:17px;line-height:1}
.ar span{font-size:10px;font-weight:600;color:var(--mut);line-height:1.1}
.ar.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ar.on span{color:#fff}
.ex{border-top:1px solid var(--line);padding:16px 0}
.ex:first-child{border-top:0;padding-top:4px}
.ex .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex .hd b{font-weight:800;font-size:17px}
.ex2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.exc{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;min-width:0}
.exc b{font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em}
.mini{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px}
.tips{display:grid;gap:12px;margin-top:14px}
.tip{border:1px solid var(--line);background:var(--bg2);border-radius:20px;padding:18px}
.tip.hot{border-color:var(--ac)}
.tip h3{font-weight:800;font-size:19px;letter-spacing:-.015em;margin-top:6px}
.tip p{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--tx2);margin-top:8px}
.tip ul{margin:12px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--tx2)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.kpi{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--bg2);border-radius:18px;padding:16px 14px 14px;box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--kc,var(--ac))}
.kpi.k2{--kc:var(--grn)}.kpi.k3{--kc:var(--org)}
.kpi b{display:block;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.kpi b small{font-size:14px;color:var(--mut);font-weight:600;letter-spacing:0}
.kpi p{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.35}
.ins-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
.ins{border:1px solid var(--line);background:var(--bg2);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--sh)}
.ins .k{gap:8px}.ins .k i{flex:none;width:10px;height:10px;border-radius:50%}
.ins .t{font-weight:800;font-size:19px;line-height:1.2;letter-spacing:-.015em;margin-top:8px}
.ins .s{font-family:var(--serif);font-size:15px;color:var(--tx2);margin-top:6px;line-height:1.45}
.heat{display:grid;grid-template-columns:36px repeat(5,minmax(0,1fr)) 46px;gap:5px;margin-top:14px;align-items:center}
.hc{font-size:11px;font-weight:600;color:var(--mut);text-align:center}
.hr{font-size:12px;font-weight:700;color:var(--mut)}
.cell{border-radius:10px;min-height:46px;display:grid;place-content:center;text-align:center;font-weight:800;font-size:15px;line-height:1.1}
.cell small{font-size:10px;font-weight:600;opacity:.8}
.cell.e{border:1px dashed var(--line);color:var(--mut);font-weight:600}
.cell.p{background:var(--bg3);border:1px solid var(--line)}
.scale{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--mut)}
.scale i{flex:1;height:8px;border-radius:4px;max-width:180px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 54px;gap:10px;align-items:center;margin-top:10px;font-size:13px}
.bar.w{grid-template-columns:118px minmax(0,1fr) 62px}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.trk{height:20px;border-radius:6px;background:var(--bg3);display:flex;gap:2px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:4px;min-width:0}
.trk i.one{background:var(--ac)}
.bar .v{text-align:right;font-weight:800}
.bar .v small{font-weight:600;color:var(--mut)}
.bar.low{opacity:.6}
.db{margin-top:18px}
.db .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.db .hd b{font-weight:800;font-size:16px}
.db .dl{font-weight:800;font-size:20px;letter-spacing:-.02em}
.db .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:2px}
.db .st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tr{position:relative;height:30px;margin:6px 10px 0}
.tr .ln{position:absolute;top:14px;height:3px;border-radius:2px;background:var(--line)}
.tr .base{position:absolute;left:0;right:0;top:14px;height:3px;background:var(--bg3);border-radius:2px}
.tr .d{position:absolute;top:7px;width:17px;height:17px;border-radius:50%;transform:translateX(-50%)}
.tr .d.y{background:var(--grn);border:3px solid var(--bg2);box-shadow:0 0 0 1px var(--grn)}
.tr .d.n{background:var(--bg2);border:3px solid var(--red)}
.axis{position:relative;height:16px;margin:0 10px;font-size:11px;color:var(--mut)}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;height:190px;align-items:end;margin-top:16px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.col .b{width:100%;border-radius:8px 8px 3px 3px;background:var(--ac);min-height:3px}
.col.e .b{background:var(--bg3)}
.col .v{font-weight:800;font-size:16px}
.cl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px;text-align:center;font-size:12px;color:var(--mut)}
.cl b{display:block;color:var(--tx);font-size:13px}
.prog{height:10px;border-radius:5px;background:var(--bg3);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:5px}
.svgw{overflow-x:auto;margin-top:10px}
.sv{display:block;width:100%;height:auto;min-width:300px}
.sv-t{fill:var(--mut);font:600 9px var(--sans)}
.sv-v{fill:var(--tx);font:800 11px var(--sans)}
.sv-g{stroke:var(--line);stroke-width:1}
.sv-l{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sv-a{fill:var(--ac);opacity:.14}
.sv-p{fill:var(--ac);stroke:var(--bg2);stroke-width:2}
.sv-y{fill:var(--grn)}
.sv-n{fill:none;stroke:var(--red);stroke-width:2}
.sv-0{fill:var(--line)}
.hist-d{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.hist-d h3{font-weight:800;font-size:16px;letter-spacing:-.01em}
.mk{display:flex;gap:5px}
.mk i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.mk i svg{width:13px;height:13px}
.mk .y{background:var(--grn);color:var(--onlv)}.mk .n{background:var(--red);color:var(--onred)}.mk .z{background:var(--bg3);border:1px solid var(--line)}
.empty{border:1px dashed var(--line);border-radius:20px;padding:34px 20px;text-align:center;color:var(--mut);margin-top:24px}
.empty b{display:block;color:var(--tx);font-weight:800;font-size:18px;margin-bottom:6px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,7,18,.66);display:flex;align-items:flex-end;justify-content:center}
.panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 16px}
.panel{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:680px;max-height:92dvh;overflow-y:auto;
  padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lv{display:block;width:100%;text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:10px}
.lv b{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.lv b i{width:12px;height:12px;border-radius:4px;display:inline-block}
.lv span{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.lv.on{background:var(--bg3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.elist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.elist li{display:flex;gap:8px}
input.ei,input.na{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px}
.ib{border:1px solid var(--line);background:var(--bg3);border-radius:12px;min-width:46px;min-height:46px;display:grid;place-items:center;color:var(--red);font-weight:700;font-size:13px;padding:0 10px}
.ib.arm{background:var(--red);border-color:var(--red);color:var(--onred)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,520px);background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.bad{border-color:var(--red)}
.foot{margin-top:40px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.bh{display:flex;align-items:center;gap:12px;min-width:0}
.bn{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--bg3);border:1px solid var(--line);color:var(--mut)}

const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function gz(t){const cs=new Blob([t]).stream().pipeThrough(new CompressionStream("gzip"));return new Uint8Array(await new Response(cs).arrayBuffer())}
async function ungz(u){const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));return await new Response(ds).text()}
async function makeCode(){const j=JSON.stringify({v:1,n:{l:Object.keys(logs).length,h:Object.keys(habs).length},logs,habs,acts,actsTs,prof,profTs,projs,projsTs});
  try{if(typeof CompressionStream!=="undefined")return"NC2:"+b64(await gz(j))}catch(e){}
  return"NC1:"+b64(new TextEncoder().encode(j))}
async function readCode(c){c=String(c).replace(/\s+/g,"");const k=c.slice(0,4),u=unb64(c.slice(4));
  const j=k==="NC2:"?await ungz(u):k==="NC1:"?new TextDecoder().decode(u):null;if(j==null)throw 0;const o=JSON.parse(j);if(o&&o.n&&(Object.keys(o.logs||{}).length!==o.n.l||Object.keys(o.habs||{}).length!==o.n.h))throw 0;return o}
function importData(o){
  let n=0;const w=[],dRe=/^\d{4}-\d{2}-\d{2}$/;
  Object.values(o.logs||{}).forEach(r=>{
    if(!r||!dRe.test(r.date)||!(r.b>=1&&r.b<=5)||!(r.lv>=1&&r.lv<=3))return;
    const k=id(r.date,r.b-1),cur=logs[k],ts=+r.ts||0;if(cur&&(+cur.ts||0)>=ts)return;
    const x={date:r.date,b:+r.b,lv:+r.lv,act:String(r.act||"").slice(0,40),cat:r.cat==="p"?"p":"w",ts};if(r.ar>=1&&r.ar<=5)x.ar=+r.ar;
    logs[k]=x;w.push([k,x]);n++});
  Object.values(o.habs||{}).forEach(r=>{
    if(!r||!dRe.test(r.date))return;
    const cur=habs[r.date],ts=+r.ts||0;if(cur&&(+cur.ts||0)>=ts)return;
    const x={date:r.date,ts};HAB.forEach(h=>{if(r[h.k]===0||r[h.k]===1)x[h.k]=r[h.k]});
    habs[r.date]=x;w.push(["hab_"+r.date,x]);n++});
  if((+o.actsTs||0)>actsTs){const a=parseActs(o.acts);if(a){acts=a;actsTs=+o.actsTs;w.push(["cfg",{acts:JSON.stringify(acts),ts:actsTs}])}}
  if((+o.projsTs||0)>projsTs){const a=parseProjs(o.projs);if(a){projs=a;projsTs=+o.projsTs;w.push(["proj",{items:JSON.stringify(projs),ts:projsTs}])}}
  if(o.prof&&(+o.profTs||0)>profTs){prof={name:String(o.prof.name||"").slice(0,24),av:+o.prof.av||0};profTs=+o.profTs;w.push(["prof",{name:prof.name,av:prof.av,ts:profTs}])}
  lsSave();wr(()=>Promise.all(w.map(([k,x])=>col.doc(k).set(x))));
  render();renderTop();return n;
}
function parseActs(v){try{if(typeof v==="string")v=JSON.parse(v);if(v&&Array.isArray(v.w)&&Array.isArray(v.p))return{w:v.w.map(String),p:v.p.map(String)}}catch(e){}return null}
const greet=()=>{const h=new Date().getHours();return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"};
const dispName=()=>prof.name||pName;
const curAv=()=>{const n=+prof.av;return n>=1&&n<=3?n:1};
function avHtml(n,px){const u=(window.AVS||[])[n-1];return`<span class="av" style="width:${px}px;height:${px}px">${u?`<img src="${u}" alt="" width="${px}" height="${px}">`:`<span style="font-size:${Math.round(px*.4)}px">${esc((dispName()||"N").charAt(0).toUpperCase())}</span>`}</span>`}

  <div class="tools">

    </button>

  </div>`;
  if(h!==lastTop){const el=$("#top");if(el){el.innerHTML=h;lastTop=h}}

function setSync(c){cloud=!!c;renderTop()}
function saveProf(){profTs=Date.now();lsSave();wr(()=>col.doc("prof").set({name:prof.name,av:prof.av,ts:profTs}))}
function commitName(){
  const i=$("#nm");if(!i||!sheet||sheet.t!=="set")return false;
  const v=i.value.trim().slice(0,24);sheet.nm=undefined;
  if(v===prof.name)return false;
  prof.name=v;saveProf();renderTop();return true;
}
function toast(m,bad){const t=$("#tt");t.innerHTML=`<div class="toast${bad?" bad":""}" role="status">${esc(m)}</div>`;clearTimeout(tmr);tmr=setTimeout(()=>{t.innerHTML=""},bad?6000:2500)}
async function wr(fn){if(!col)return;try{await fn()}catch(e){toast("No se pudo guardar en tu cuenta"+(e&&e.code?" ("+e.code+")":"")+". Quedó en este dispositivo.",1)}}
async function init(){
  lsLoad();setSync(false);render();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{
    if(typeof claude!=="undefined"){
      const u=await claude.use("user"),db=await claude.use("db");
      const uid=u?await u.id():null;
      try{const me=u&&u.me?await u.me():null,n0=me&&me.name?String(me.name).trim().split(/\s+/)[0]:"";if(n0){pName=n0.slice(0,24);renderTop()}}catch(e){}
      if(db&&uid){
        col=db.collection("data/users/"+uid);
        col.onSnapshot(s=>{
          const Lg={},Hb={};let cfg=null,pr=null,pj=null;
          s.docs.forEach(d=>{const x=d.data();if(!x)return;const o=clone(x);
            if(d.id.startsWith("log_"))Lg[d.id]=o;
            else if(d.id.startsWith("hab_"))Hb[o.date||d.id.slice(4)]=o;
            else if(d.id==="cfg")cfg=o;
            else if(d.id==="proj")pj=o;
            else if(d.id==="prof")pr=o});
          logs=Lg;habs=Hb;
          if(cfg){const a=parseActs(cfg.acts);if(a&&(cfg.ts||0)>=actsTs){acts=a;actsTs=cfg.ts||0}}
          if(pj){const a=parseProjs(pj.items);if(a&&(pj.ts||0)>=projsTs){projs=a;projsTs=pj.ts||0}}
          if(pr&&(pr.ts||0)>=profTs){prof={name:String(pr.name||"").slice(0,24),av:+pr.av||0};profTs=pr.ts||0}
          setSync(true);lsSave();render();
        },()=>{col=null;setSync(false)});
      }
    }
  }catch(e){}
}

/* ---------- Escritura de datos ---------- */
function put(d,i,lv,act,cat,ar){
  const r={date:d,b:i+1,lv,act:act||"",cat:act?cat:"",ts:Date.now()};
  if(ar)r.ar=ar;
  logs[id(d,i)]=r;lsSave();render();
  wr(()=>col.doc(id(d,i)).set(r));
}
function rmLog(k){delete logs[k];armed=null;lsSave();render();wr(()=>col.doc(k).delete())}
function arm(k){if(armed===k){rmLog(k);return}armed=k;render();setTimeout(()=>{if(armed===k){armed=null;render()}},3500)}
function setHab(d,k,val){
  const cur=Object.assign({},habs[d]||{});
  if(val===null)delete cur[k];else cur[k]=val;
  cur.date=d;
  const has=HAB.some(h=>cur[h.k]!==undefined);
  if(has){cur.ts=Date.now();habs[d]=cur}else delete habs[d];
  lsSave();render();
  wr(()=>has?col.doc("hab_"+d).set(cur):col.doc("hab_"+d).delete());
}
function saveActs(){actsTs=Date.now();lsSave();wr(()=>col.doc("cfg").set({acts:JSON.stringify(acts),ts:actsTs}))}
function renameAct(k,v){
  const c=sheet.cat,old=acts[c][k];v=v.trim();
  if(!v||v===old){renderSheet();return}
  if(acts[c].some((a,j)=>j!==k&&a.toLowerCase()===v.toLowerCase())){toast("Ya existe una actividad con ese nombre.",1);renderSheet();return}
  acts[c][k]=v;saveActs();
  Object.keys(logs).forEach(key=>{const r=logs[key];if(r&&r.act===old&&(r.cat===c||!r.cat)){r.act=v;r.cat=c;wr(()=>col.doc(key).set(r))}});
  lsSave();toast("Nombre actualizado");render();
}

/* ---------- Acciones ---------- */
const A={
 tab(d){tab=d.v;render();scrollTo(0,0)},
 theme(){const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("nc_theme",t)}catch(e){}syncSw()},
 ar(d){sheet.ar=sheet.ar===+d.v?0:+d.v;renderSheet()},
 calopen(){
   const t=dk(new Date()),m=t.slice(0,7),ds=[...recs().map(r=>r.date),...Object.keys(habs)].filter(d=>d.slice(0,7)===m&&d<=t).sort();
   sheetBack=null;sheet={t:"cal",m,sel:ds.length?ds[ds.length-1]:null};renderSheet();
 },
 async expcode(){const i=$("#nm");if(i&&sheet&&sheet.t==="set")sheet.nm=i.value;const t=$("#impc");if(t&&sheet)sheet.imp=t.value;
   try{sheet.code=await makeCode();const nl=Object.keys(logs).length,nh=Object.keys(habs).length;sheet.info=nl+" registro"+(nl===1?"":"s")+" y "+nh+" día"+(nh===1?"":"s")+" de hábitos"}catch(e){toast("No se pudo generar el código.",1);return}
   renderSheet();A.copycode();
 },
 copycode(){
   const c=sheet&&sheet.code;if(!c)return;
   const sel=()=>{const t=$("#codeta");if(t){t.focus();t.select()}toast("Mantén pulsado el texto y copia el código.")};
   try{navigator.clipboard.writeText(c).then(()=>toast("Código copiado. Pégalo en el otro dispositivo."),sel)}catch(e){sel()}
 },
 async impcode(){
   const t=$("#impc"),c=(t?t.value:"").trim();if(!c){toast("Pega primero tu código.",1);return}
   try{const o=await readCode(c);if(!o||typeof o!=="object"||(!o.logs&&!o.habs))throw 0;const n=importData(o);if(sheet)sheet.imp="";renderSheet();
     toast(n?`Listo: se importaron ${n} registro${n===1?"":"s"}.`:"Listo: ya tenías todo eso.")}
   catch(e){toast("Ese código no es válido. Cópialo completo.",1)}
 },
 arz(){sheetBack=null;sheet={t:"arz",dir:""};renderSheet()},
 arzd(d){sheet.dir=d.v;renderSheet()},
 calnav(d){
   const[y,mo]=sheet.m.split("-").map(Number),n=new Date(y,mo-1+ +d.v,1),m=n.getFullYear()+"-"+pad(n.getMonth()+1);
   if(m>dk(new Date()).slice(0,7))return;
   sheet.m=m;sheet.sel=null;armed=null;renderSheet();
 },
 calsel(d){sheet.sel=sheet.sel===d.d?null:d.d;armed=null;renderSheet()},
 wk(d){const n=weekOff+ +d.v;if(n>0)return;weekOff=n;wkOpen={};render()},
 wkd(d){wkOpen[d.d]=!wkOpen[d.d];render()},
 pedit(){sheetBack=null;sheet={t:"proj",nc:"p",arm:null};renderSheet()},
 pnc(d){keepNew();sheet.nc=d.v;renderSheet()},
 ptog(d){keepNew();const p=projs[+d.i];if(!p)return;p.st=p.st==="p"?"s":"p";saveProjs();renderSheet();render()},
 pcat(d){keepNew();const p=projs[+d.i];if(!p)return;p.c=p.c==="w"?"p":"w";saveProjs();renderSheet();render()},
 pdel(d){
   keepNew();const k=+d.i;
   if(sheet.arm===k){projs.splice(k,1);sheet.arm=null;saveProjs();renderSheet();render();return}
   sheet.arm=k;renderSheet();setTimeout(()=>{if(sheet&&sheet.t==="proj"&&sheet.arm===k){sheet.arm=null;renderSheet()}},3500);
 },
 padd(){
   const a=$("#newproj"),b=$("#newprojd");if(!a)return;const v=a.value.trim();if(!v)return;
   if(projs.some(p=>p.n.toLowerCase()===v.toLowerCase())){toast("Ya existe ese proyecto.",1);return}
   projs.push({n:v.slice(0,40),d:(b?b.value.trim():"").slice(0,60),c:sheet.nc||"p",st:"p"});
   sheet.nn=sheet.nd="";sheet.arm=null;saveProjs();renderSheet();render();const n=$("#newproj");if(n)n.focus();
 },
 settings(){sheetBack=null;sheet={t:"set"};renderSheet()},
 av(d){const i=$("#nm");if(i&&sheet&&sheet.t==="set")sheet.nm=i.value;prof.av=+d.v;saveProf();renderTop();renderSheet()},
 savename(){commitName();toast(prof.name?"Listo, te diré "+prof.name+".":"Nombre borrado.")},
 an(d){anTab=d.v;render()},
 actf(d){actF=d.v;render()},
 hday(d){habDay=d.v;render()},
 hab(d){const cur=(habs[d.d]||{})[d.k],v=+d.v;setHab(d.d,d.k,cur===v?null:v)},
 open(d){sheet={t:"reg",d:d.d,i:+d.i,lv:0,ar:0,act:"",cat:"w"};sheetBack=null;renderSheet()},
 lv(d){sheet.lv=+d.v;renderSheet()},
 cat(d){sheet.cat=d.v;sheet.act="";renderSheet()},
 pick(d){const a=acts[sheet.cat][+d.k];sheet.act=sheet.act===a?"":a;renderSheet()},
 save(){if(!sheet.lv)return;put(sheet.d,sheet.i,sheet.lv,sheet.act,sheet.cat,sheet.ar);sheet=null;sheetBack=null;renderSheet()},

   if(sheet&&sheet.t==="set")commitName();
   if(sheet&&sheet.t==="edit"&&sheetBack){sheet=sheetBack;sheetBack=null;if(sheet.t==="reg"&&!acts[sheet.cat].includes(sheet.act))sheet.act="";renderSheet()}
   else{sheet=null;sheetBack=null;renderSheet()}
 },
 del(d){arm(d.k)},
 openedit(){if(sheet&&sheet.t==="set")commitName();sheetBack=sheet;sheet={t:"edit",cat:sheetBack.cat||"w",arm:null};renderSheet()},
 openedit0(){sheetBack=null;sheet={t:"edit",cat:"w",arm:null};renderSheet()},
 ecat(d){sheet.cat=d.v;sheet.arm=null;renderSheet()},
 delact(d){
   const k=+d.k;
   if(sheet.arm===k){acts[sheet.cat].splice(k,1);sheet.arm=null;saveActs();renderSheet();return}
   sheet.arm=k;renderSheet();setTimeout(()=>{if(sheet&&sheet.t==="edit"&&sheet.arm===k){sheet.arm=null;renderSheet()}},3500);
 },
 addact(){
   const i=$("#newact");if(!i)return;const v=i.value.trim();if(!v)return;
   if(acts[sheet.cat].some(a=>a.toLowerCase()===v.toLowerCase())){toast("Ya existe esa actividad.",1);return}
   acts[sheet.cat].push(v);sheet.arm=null;saveActs();renderSheet();
   const n=$("#newact");if(n)n.focus();
 },
 resetacts(){
   if(sheet.arm==="reset"){acts[sheet.cat]=DEF[sheet.cat].slice();sheet.arm=null;saveActs();renderSheet();return}
   sheet.arm="reset";renderSheet();setTimeout(()=>{if(sheet&&sheet.t==="edit"&&sheet.arm==="reset"){sheet.arm=null;renderSheet()}},3500);
 }
};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");
  if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset);return}
  if(e.target.classList&&e.target.classList.contains("sheet"))A.close();
});
document.addEventListener("change",e=>{const t=e.target;if(t.classList&&t.classList.contains("ei")&&sheet&&sheet.t==="edit")renameAct(+t.dataset.k,t.value)});
document.addEventListener("change",e=>{const t=e.target;if(!t.classList||!sheet||sheet.t!=="proj")return;const i=+t.dataset.i,p=projs[i];if(!p)return;
  if(t.classList.contains("pn")){const v=t.value.trim();if(v){p.n=v.slice(0,40);saveProjs();render()}else t.value=p.n}
  else if(t.classList.contains("pd")){p.d=t.value.trim().slice(0,60);saveProjs();render()}});
document.addEventListener("input",e=>{if(e.target&&e.target.id==="nm"&&sheet&&sheet.t==="set")sheet.nm=e.target.value;if(e.target&&e.target.id==="impc"&&sheet&&sheet.t==="set")sheet.imp=e.target.value});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Enter"){
    if(t.id==="newact"){e.preventDefault();A.addact()}
    else if(t.id==="newproj"||t.id==="newprojd"){e.preventDefault();A.padd()}
    else if(t.id==="nm"){e.preventDefault();A.savename()}
    else if(t.classList&&t.classList.contains("ei")){e.preventDefault();t.blur()}
  }
  if(e.key==="Escape"&&sheet)A.close();
});

/* ---------- Hoja de registro y editor ---------- */
function renderSheet(){
  const el=$("#sh");
  if(!sheet){el.innerHTML="";return}
  const old=el.querySelector(".panel"),sc=old?old.scrollTop:0;
  el.innerHTML=`<div class="sheet"><div class="panel" role="dialog" aria-modal="true" aria-label="${sheet.t==="edit"?"Editar actividades":sheet.t==="set"?"Configuración":sheet.t==="cal"?"Historial":sheet.t==="proj"?"Mis proyectos":sheet.t==="arz"?"Ajustar excitación":"Registrar rendimiento"}">${sheet.t==="edit"?editorHtml():sheet.t==="set"?setHtml():sheet.t==="cal"?calHtml():sheet.t==="proj"?projHtml():sheet.t==="arz"?arzHtml():regHtml()}</div></div>`;
  const p=el.querySelector(".panel");if(p)p.scrollTop=sc;
}

function setHtml(){
  const cur=curAv(),nm=sheet.nm!=null?sheet.nm:prof.name;
  return`<div class="row"><div><div class="eyebrow">Configuración</div><h2 class="h2">Tu perfil</h2></div><button type="button" class="btn sm" data-a="close">Listo</button></div>

/* ---------- Análisis ---------- */
function dayPerf(){const m={};recs().forEach(r=>(m[r.date]=m[r.date]||[]).push(r.lv));return m}
function best(map,minN,dir){let k=null,v=dir>0?-1:9;for(const x in map){const a=map[x];if(a.length<minN)continue;const m=mean(a);if(dir>0?m>v:m<v){v=m;k=x}}return k===null?null:{k,v,n:map[k].length}}
const INC={"Tu mejor bloque":"grn","Tu bloque más flojo":"org","Tu mejor día":"grn","Actividad que mejor te rinde":"pur","Tu hábito más poderoso":"grn","Casi no cambia tu rendimiento":"org","El que más se te escapa":"red","Tu pico estimado":"pur"};
const insC=(k,t)=>INC[k]?`var(--${INC[k]})`:/\(sube\)/.test(t)?"var(--grn)":/\(baja\)/.test(t)?"var(--red)":"var(--ac)";
const ins=(k,t,s)=>`<div class="ins"><div class="eyebrow m k"><i style="background:${insC(k,t)}"></i>${k}</div><div class="t">${t}</div><div class="s">${s}</div></div>`;
const secH=(e,t,l)=>`<div class="sec"><div class="eyebrow">${e}</div><h2 class="h2">${t}</h2>${l?`<p class="lede">${l}</p>`:""}</div>`;
const emptyBox=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`;
function catOf(r){return r.cat||(acts.w.includes(r.act)?"w":acts.p.includes(r.act)?"p":"")}

function trendSvg(days,dp,withHab){
  const n=days.length,W=340,pl=34,pr=12,x=i=>n>1?pl+i*(W-pl-pr)/(n-1):pl+(W-pl-pr)/2;
  const y=v=>104-(v-1)/2*84,H=withHab?236:134;
  let s=`<svg class="sv" viewBox="0 0 ${W} ${H}" role="img" aria-label="${withHab?"Rendimiento diario y hábitos cumplidos por día":"Rendimiento promedio por día"}">`;
  [[1,"Bajo"],[2,"Alto"],[3,"Máx"]].forEach(([v,l])=>{s+=`<line class="sv-g" x1="${pl-4}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" ${v===2?'stroke-dasharray="3 4"':""}/><text class="sv-t" x="0" y="${y(v)+3}">${l}</text>`});
  const seg=[];let cur=[];
  days.forEach((d,i)=>{if(dp[d])cur.push([x(i),y(mean(dp[d])),d]);else if(cur.length){seg.push(cur);cur=[]}});
  if(cur.length)seg.push(cur);
  seg.forEach(g=>{
    if(g.length>1){s+=`<path class="sv-a" d="M${g[0][0]},${y(1)} ${g.map(p=>`L${p[0]},${p[1]}`).join(" ")} L${g[g.length-1][0]},${y(1)} Z"/><polyline class="sv-l" points="${g.map(p=>p[0]+","+p[1]).join(" ")}"/>`}
  });
  const all=seg.flat();
  all.forEach((p,j)=>{const last=j===all.length-1;s+=`<circle class="sv-p" style="fill:var(--lv${Math.max(1,Math.min(3,Math.round(mean(dp[p[2]]))))})" cx="${p[0]}" cy="${p[1]}" r="${last?7:5}"><title>${dd(p[2])}: ${f1(mean(dp[p[2]]))}</title></circle>`;if(last)s+=`<text class="sv-v" x="${Math.min(p[0],W-14)}" y="${p[1]-11}" text-anchor="middle">${f1(mean(dp[p[2]]))}</text>`});
  let yb=H-8;
  if(withHab){
    HAB.forEach((h,r)=>{
      const cy=136+r*24;
      s+=`<text class="sv-t" x="0" y="${cy+3}">${h.s}</text>`;
      days.forEach((d,i)=>{const v=(habs[d]||{})[h.k];
        if(v===1)s+=`<circle class="sv-y" cx="${x(i)}" cy="${cy}" r="6"><title>${h.n} ${dd(d)}: cumplido</title></circle>`;
        else if(v===0)s+=`<circle class="sv-n" cx="${x(i)}" cy="${cy}" r="5"><title>${h.n} ${dd(d)}: no cumplido</title></circle>`;
        else s+=`<circle class="sv-0" cx="${x(i)}" cy="${cy}" r="2"/>`});
    });
    yb=H-6;
  }
  s+=`<text class="sv-t" x="${x(0)}" y="${yb}" text-anchor="${n>1?"start":"middle"}">${dd(days[0])}</text>`;
  if(n>1)s+=`<text class="sv-t" x="${x(n-1)}" y="${yb}" text-anchor="end">${dd(days[n-1])}</text>`;
  return s+`</svg>`;
}

function blockBars(byB){
  const W=340,pl=34,pr=12,sw=(W-pl-pr)/5,bw=Math.min(40,sw-14),y=v=>112-v/3*88;
  let s=`<svg class="sv" viewBox="0 0 ${W} 150" role="img" aria-label="Promedio de rendimiento por bloque">`;
  [[1,"Bajo"],[2,"Alto"],[3,"Máx"]].forEach(([v,l])=>{s+=`<line class="sv-g" x1="${pl-4}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" ${v===2?'stroke-dasharray="3 4"':""}/><text class="sv-t" x="0" y="${y(v)+3}">${l}</text>`});
  s+=`<line class="sv-g" x1="${pl-4}" x2="${W-pr}" y1="112" y2="112"/>`;
  for(let i=0;i<5;i++){
    const a=byB[i+1],cx=pl+sw*i+sw/2;
    if(a){const m=mean(a);s+=`<rect x="${cx-bw/2}" y="${y(m)}" width="${bw}" height="${112-y(m)}" rx="6" style="fill:var(--lv${Math.round(m)})"><title>Bloque ${i+1}: ${f1(m)} (${a.length} registro${a.length>1?"s":""})</title></rect><text class="sv-v" x="${cx}" y="${y(m)-6}" text-anchor="middle">${f1(m)}</text>`}
    else s+=`<text class="sv-t" x="${cx}" y="106" text-anchor="middle">–</text>`;
    s+=`<text class="sv-v" x="${cx}" y="128" text-anchor="middle" style="font-size:10px">B${i+1}</text><text class="sv-t" x="${cx}" y="141" text-anchor="middle">${t12(B[i][0]).replace(":00","").replace(" ","")}</text>`;
  }
  return s+`</svg>`;
}
function anR(){

    const w=wdOf(r.date);(byD[w]=byD[w]||[]).push(r.lv);
    if(r.act)(byA[r.act]=byA[r.act]||[]).push(r.lv);

   <div class="kpi k2"><span class="eyebrow m">Promedio</span><b class="tab">${f1(mean(all))}<small> / 3</small></b><p>1 es Bajo, 3 es Máximo</p></div>
   <div class="kpi k3"><span class="eyebrow m">Máximo</span><b class="tab">${Math.round(mx/R.length*100)}<small>%</small></b><p>de tus bloques</p></div></div>`;
  /* Hallazgos */
  const bb=best(byB,minN,1),wb=best(byB,minN,-1),bd=best(byD,minN,1),ba=best(byA,minN,1);

  if(bb)cards+=ins("Tu mejor bloque",`Bloque ${bb.k} · ${rng(bb.k-1)}`,`Promedio ${f1(bb.v)} en ${bb.n} registro${bb.n>1?"s":""}. Aquí conviene poner el trabajo que más exige tu cabeza.`);

  if(bd)cards+=ins("Tu mejor día",cap(DNL[bd.k]),`Promedio ${f1(bd.v)} en ${bd.n} registro${bd.n>1?"s":""}.`);
  if(ba)cards+=ins("Actividad que mejor te rinde",esc(ba.k),`Promedio ${f1(ba.v)} en ${ba.n} registro${ba.n>1?"s":""}. Prográmala en tus mejores bloques.`);
  const bw=R.filter(r=>catOf(r)==="w").map(r=>r.lv),bp=R.filter(r=>catOf(r)==="p").map(r=>r.lv);
  if(bw.length&&bp.length)cards+=ins("Trabajo y Personal",`${f1(mean(bw))} y ${f1(mean(bp))}`,`Promedio en Trabajo (${bw.length}) y en Personal (${bp.length}).`);
  const ds=Object.keys(byDate).sort();
  if(ds.length>=3){
    const t=new Date(),lim=k=>dk(new Date(t.getFullYear(),t.getMonth(),t.getDate()-k));
    const a=R.filter(r=>r.date>lim(7)).map(r=>r.lv),b=R.filter(r=>r.date<=lim(7)&&r.date>lim(14)).map(r=>r.lv);
    if(a.length&&b.length){const dl=mean(a)-mean(b);cards+=ins("Últimos 7 días",`${f1(mean(a))} ${dl>=0.05?"(sube)":dl<=-0.05?"(baja)":"(igual)"}`,`${dl>=0?"+":""}${dl.toFixed(1)} frente a los 7 días anteriores (${f1(mean(b))}).`)}
  }
  h+=secH("Hallazgos","Lo que muestran tus datos",R.length<15?"Con pocos registros las conclusiones son tentativas. Apunta a unos 3 o más por casilla antes de reorganizar tu día.":"")+`<div class="ins-g">${cards}</div>`;
  /* Mapa de calor */
  const days=[1,2,3,4,5,6,0].filter(w=>w!==0||byD[0]);
  let ht=`<div class="heat"><span></span>${B.map((_,i)=>`<span class="hc">B${i+1}<br>${t12(B[i][0]).replace(":00","").replace(" ","")}</span>`).join("")}<span class="hc">Día</span>`;
  days.forEach(w=>{
    ht+=`<span class="hr">${DN[w]}</span>`;
    B.forEach((_,i)=>{const a=grid[w+"_"+(i+1)];ht+=a?`<span class="cell tab" style="${heat(mean(a))}" title="${DN[w]} bloque ${i+1}: ${f1(mean(a))} (${a.length})">${f1(mean(a))}<small>n=${a.length}</small></span>`:`<span class="cell e">–</span>`});
    const dv=byD[w];ht+=dv?`<span class="cell p tab">${f1(mean(dv))}</span>`:`<span class="cell e">–</span>`;

function pearson(xs,ys){const n=xs.length;if(n<3)return null;const mx=mean(xs),my=mean(ys);let a=0,b=0,c=0;for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;a+=dx*dy;b+=dx*dx;c+=dy*dy}return b&&c?a/Math.sqrt(b*c):null}
function streak(){let s=0;const t=new Date();for(let k=0;k<400;k++){const d=dk(new Date(t.getFullYear(),t.getMonth(),t.getDate()-k)),v=habs[d],any=v&&HAB.some(x=>v[x.k]!==undefined),yes=v?HAB.filter(x=>v[x.k]===1).length:0;if(k===0&&!any)continue;if(yes>=3)s++;else break}return s}
function verdict(dl,ok){if(!ok)return{t:"Faltan datos",c:"var(--line)"};if(dl>=0.2)return{t:"Ayuda a tu rendimiento",c:"var(--grn)"};if(dl<=-0.2)return{t:"Va al revés",c:"var(--red)"};return{t:"Sin efecto claro",c:"var(--mut)"}}

function anH(){

  const sc=d=>{const v=habs[d],a=HAB.filter(x=>v[x.k]!==undefined);return a.length?a.filter(x=>v[x.k]===1).length/a.length:null};
  const avgSc=mean(hd.map(sc)),joint=hd.filter(d=>dp[d]&&dp[d].length>=2),sk=streak();
  const conf=joint.length<7?"baja":joint.length<14?"media":"alta";
  let h=`<div class="kpis">

function fitQuad(p){
  let s1=0,s2=0,s3=0,s4=0,t0=0,t1=0,t2=0;const n=p.length;
  p.forEach(([x,y])=>{s1+=x;s2+=x*x;s3+=x**3;s4+=x**4;t0+=y;t1+=x*y;t2+=x*x*y});
  const M=[[s4,s3,s2,t2],[s3,s2,s1,t1],[s2,s1,n,t0]];
  for(let i=0;i<3;i++){
    let q=i;for(let r=i+1;r<3;r++)if(Math.abs(M[r][i])>Math.abs(M[q][i]))q=r;
    [M[i],M[q]]=[M[q],M[i]];if(Math.abs(M[i][i])<1e-9)return null;
    for(let r=0;r<3;r++)if(r!==i){const f=M[r][i]/M[i][i];for(let c=i;c<4;c++)M[r][c]-=f*M[i][c]}
  }
  return{a:M[0][3]/M[0][0],b:M[1][3]/M[1][1],c:M[2][3]/M[2][2]};
}

  h+=secH("Ajustar","Cómo mover tu excitación")+`<button type="button" class="hbtn" data-a="arz" style="margin-top:14px">${ic.sl}<span class="tx"><span class="t">Mueve o ajusta tu excitación</span><span class="s">${st==="low"?"Ahora te conviene subirla.":st==="high"?"Ahora te conviene bajarla.":"Te digo qué hacer para subirla o bajarla."}</span></span>${ic.chr.replace("<svg ",'<svg style="width:22px;height:22px" ')}</button>`;
  h+=`<p class="sm mut" style="margin-top:14px">La curva de referencia es un modelo general. La tuya sale de lo que tú registras, así que depende de qué tan honesto y constante seas al marcar cada bloque.</p>`;
  return h;
}

/* ---------- En foco (proyectos) ---------- */
function keepNew(){const a=$("#newproj"),b=$("#newprojd");if(a&&sheet)sheet.nn=a.value;if(b&&sheet)sheet.nd=b.value}
function focoCard(){
  const np=projs.filter(p=>p.st==="p").length;
  const grp=(c,t)=>{const g=projs.filter(p=>p.c===c).sort((x,y)=>(x.st==="p"?0:1)-(y.st==="p"?0:1));
    return`<div class="fr"><span class="fl">${t}</span>${g.length?`<div class="fcs">${g.map(p=>p.st==="p"?`<span class="fc"><b>${esc(p.n)}</b>${p.d?`<small>${esc(p.d)}</small>`:""}</span>`:`<span class="fc s" title="Stand by">${ic.pause}${esc(p.n)}</span>`).join("")}</div>`:`<span class="fn" style="margin:7px 0 0">Sin proyectos</span>`}</div>`};
  return`<section class="card foco fmini" aria-label="Proyectos actuales"><div class="row"><div><div class="eyebrow">En foco</div><h2 class="h2" style="font-size:18px">Proyectos actuales</h2></div><button type="button" class="btn g sm" data-a="pedit">Editar</button></div>${grp("w","Trabajo")}${grp("p","Personal")}${np>3?`<p class="fn warn"><i></i>Tienes ${np} prioridades. Con 3 o menos mantienes el foco.</p>`:""}</section>`;
}
function habMini(){
  const d=habDay==="hoy"?dk(new Date()):dk(new Date(Date.now()-864e5)),v=habs[d]||{};
  const yes=HAB.filter(x=>v[x.k]===1).length,ans=HAB.filter(x=>v[x.k]!=null).length;
  return`<section class="card hm" aria-label="Hábitos"><div class="row"><div class="eyebrow">Hábitos</div><div class="seg s2"><button type="button" class="${habDay==="hoy"?"on":""}" data-a="hday" data-v="hoy">Hoy</button><button type="button" class="${habDay==="ayer"?"on":""}" data-a="hday" data-v="ayer">Ayer</button></div></div>
  <div class="hgrid">${HAB.map(h=>{const c=v[h.k];return`<button type="button" class="hbx ${c===1?"y":c===0?"n":""}" data-a="hab" data-d="${d}" data-k="${h.k}" data-v="${c==null?1:0}" aria-label="${h.n}: ${c===1?"cumplido":c===0?"no cumplido":"sin responder"}. Toca para cambiar"><i>${c===1?ic.ok:c===0?ic.no:""}</i><span>${h.n}</span></button>`}).join("")}</div>
  <p class="sm mut tab" style="margin-top:10px">${ans?`${yes} de ${HAB.length} cumplidos${ans<HAB.length?` · ${HAB.length-ans} sin responder`:""}. Toca para ✓, de nuevo para ✗, otra vez para borrar.`:"Toca cada hábito: ✓ si lo cumpliste, de nuevo para ✗, otra vez para borrar."}</p></section>`;
}
function projHtml(){
  const nc=sheet.nc||"p";
  return`<div class="row"><div><div class="eyebrow">En foco</div><h2 class="h2">Mis proyectos</h2></div><button type="button" class="btn sm" data-a="close">Listo</button></div>
  <p class="lede" style="margin-top:8px">Pon en Prioridad lo que importa hoy. Lo demás déjalo en Stand by: sigue mapeado, pero fuera de tu foco.</p>
  <div style="margin-top:8px">${projs.map((p,i)=>`<div class="pj-e"><input class="na pn" data-i="${i}" value="${esc(p.n)}" maxlength="40" aria-label="Nombre del proyecto"><input class="na pd" data-i="${i}" value="${esc(p.d)}" maxlength="60" placeholder="Detalle (opcional)" aria-label="Detalle de ${esc(p.n)}">
    <div class="pj-b"><button type="button" class="chip ${p.st==="p"?"act":""}" data-a="ptog" data-i="${i}">${p.st==="p"?"Prioridad":"Stand by"}</button><button type="button" class="chip" data-a="pcat" data-i="${i}">${p.c==="w"?"Trabajo":"Personal"}</button><button type="button" class="ib ${sheet.arm===i?"arm":""}" data-a="pdel" data-i="${i}" aria-label="Quitar ${esc(p.n)}">${sheet.arm===i?"¿Quitar?":ic.tr}</button></div></div>`).join("")||'<p class="mut sm" style="margin-top:12px">Aún no tienes proyectos. Agrega el primero abajo.</p>'}</div>
  <div class="eyebrow m" style="margin-top:22px">Agregar proyecto</div>
  <div style="margin-top:10px">${segHtml("pnc",nc)}</div>
  <div style="display:grid;gap:8px;margin-top:10px"><input class="na" id="newproj" placeholder="Nombre" maxlength="40" value="${esc(sheet.nn||"")}" aria-label="Nombre del proyecto nuevo"><input class="na" id="newprojd" placeholder="Detalle (opcional)" maxlength="60" value="${esc(sheet.nd||"")}" aria-label="Detalle del proyecto nuevo"><button type="button" class="btn" data-a="padd">Agregar como prioridad</button></div>`;
}
function sunBanner(){
  const n=new Date();if(n.getDay()!==0)return"";
  const set=new Set(weekDays(0));if(!recs().some(r=>set.has(r.date)))return"";
  return`<div class="banner"><div><div class="eyebrow">Tu semana cerró</div><b>Tu informe está listo</b></div><button class="btn" type="button" data-a="tab" data-v="se">Ver informe</button></div>`;
}

/* ---------- Semana ---------- */
function weekDays(off){const t=new Date(),m=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7)+7*off);return[0,1,2,3,4,5,6].map(k=>dk(new Date(m.getFullYear(),m.getMonth(),m.getDate()+k)))}
const shortD=d=>new Date(d+"T12:00:00").toLocaleDateString("es-CO",{day:"numeric",month:"short"}).replace(".","");
function se(){
  const wd=weekDays(weekOff),today=dk(new Date()),set=new Set(wd),R=recs().filter(r=>set.has(r.date));
  const ps=new Set(weekDays(weekOff-1)),PR=recs().filter(r=>ps.has(r.date));
  const st2=weekOff<0?"Cerrada":new Date().getDay()===0?"Cierra hoy":"En curso";
  let h=`<div class="eyebrow">Semana</div><h1 class="big" style="font-size:30px">${weekOff===0?"Esta semana":weekOff===-1?"Semana pasada":"Hace "+(-weekOff)+" semanas"}<span>${shortD(wd[0])} – ${shortD(wd[6])}</span></h1>
  <div class="wn"><button type="button" class="cal-n" data-a="wk" data-v="-1" aria-label="Semana anterior">${ic.chl}</button><span class="chip ${weekOff===0?"act":""}">${st2}</span><button type="button" class="cal-n" data-a="wk" data-v="1" aria-label="Semana siguiente" ${weekOff>=0?"disabled":""}>${ic.chr}</button></div>`;
  if(!R.length)h+=emptyBox("Sin registros esta semana","Cuando registres bloques, aquí verás tu informe y qué hiciste en cada uno.");
  else{
    const all=R.map(r=>r.lv),avg=mean(all),pa=PR.length?mean(PR.map(r=>r.lv)):null,dl=pa==null?null:avg-pa,mx=all.filter(x=>x===3).length;
    h+=secH("Informe","Tu rendimiento de la semana");
    h+=`<div class="kpis"><div class="kpi k2"><span class="eyebrow m">Promedio</span><b class="tab">${f1(avg)}<small> / 3</small></b><p>${dl==null?"Primera semana con datos":(dl>=0?"+":"")+dl.toFixed(1)+" frente a la anterior"}</p></div>
     <div class="kpi"><span class="eyebrow m">Registros</span><b class="tab">${R.length}<small> / 35</small></b><p>bloques registrados</p></div>
     <div class="kpi k3"><span class="eyebrow m">Máximo</span><b class="tab">${Math.round(mx/R.length*100)}<small>%</small></b><p>de tus bloques</p></div></div>`;
    const cnt=[1,2,3].map(n=>all.filter(x=>x===n).length);
    h+=`<div class="card" style="margin-top:12px"><div class="eyebrow m">Cómo se repartió</div><div class="trk" style="height:22px;margin-top:12px">${[1,2,3].map((n,i)=>cnt[i]?`<i style="width:${cnt[i]/R.length*100}%;background:var(--lv${n})" title="${L[n].n}: ${cnt[i]}"></i>`:"").join("")}</div>
     <div class="leg">${[1,2,3].map((n,i)=>`<span><i style="background:var(--lv${n})"></i>${L[n].n} ${cnt[i]}</span>`).join("")}</div>
     <div class="wcols" role="img" aria-label="Promedio por día">${wd.map(d=>{const a=R.filter(r=>r.date===d).map(r=>r.lv),m=mean(a);return`<div class="wc"><span class="v tab">${a.length?f1(m):"–"}</span><div class="b" style="${a.length?`height:${Math.max(6,m/3*100)}%;background:var(--lv${Math.round(m)})`:""}"></div></div>`}).join("")}</div>
     <div class="wl">${wd.map(d=>`<span>${DN[wdOf(d)]}</span>`).join("")}</div></div>`;
    const byA={};R.forEach(r=>{if(r.act)(byA[r.act]=byA[r.act]||[]).push(r.lv)});
    const names=Object.keys(byA),noA=R.filter(r=>!r.act).length;
    if(names.length){
      const perf=names.map(k=>({k,v:mean(byA[k]),n:byA[k].length})).sort((a,b)=>b.v-a.v||b.n-a.n);
      h+=secH("Por tarea","Cómo te fue en cada tarea","Promedio de 3 en cada tarea. El color indica el nivel.")+`<div class="card" style="margin-top:14px">${perf.map(o=>`<div class="bar w"><span class="nm" title="${esc(o.k)}">${esc(o.k)}</span><div class="trk"><i style="width:${o.v/3*100}%;background:var(--lv${Math.round(o.v)})"></i></div><span class="v tab">${f1(o.v)} <small>${L[Math.round(o.v)].n}</small></span></div>`).join("")}</div>`;
      const top=names.map(k=>({k,n:byA[k].length})).sort((a,b)=>b.n-a.n).slice(0,8),mxn=top[0].n;
      h+=secH("Más hechas","Las tareas que más hiciste","Cada bloque son 1,5 horas.")+`<div class="card" style="margin-top:14px">${top.map(o=>`<div class="bar w2"><span class="nm" title="${esc(o.k)}">${esc(o.k)}</span><div class="trk"><i class="one" style="width:${o.n/mxn*100}%"></i></div><span class="v tab">${o.n} <small>· ${(o.n*1.5).toString().replace(".",",")} h</small></span></div>`).join("")}${noA?`<p class="sm mut" style="margin-top:12px">${noA} bloque${noA>1?"s":""} sin actividad marcada.</p>`:""}</div>`;
    }else h+=`<p class="sm mut" style="margin-top:14px">Marca la actividad al registrar un bloque para ver el desglose por tarea.</p>`;
  }
  /* calendario por bloques */
  h+=secH("Calendario","Tu rendimiento en cada bloque","Cada cuadro es un bloque. La letra es el nivel: B de Bajo, A de Alto y M de Máximo. Toca un día para ver qué hiciste.");
  h+=`<div class="card" style="margin-top:14px"><div class="wg"><span></span>${wd.map(d=>`<span class="hc">${DN[wdOf(d)]}<br>${+d.slice(8)}</span>`).join("")}${B.map((_,i)=>`<span class="hr">B${i+1}</span>`+wd.map(d=>{const r=logs[id(d,i)];return r&&r.lv>=1&&r.lv<=3?`<span class="wcell l${r.lv}" title="${esc(r.act||"Sin actividad")}">${L[r.lv].n.charAt(0)}</span>`:`<span class="wcell">·</span>`}).join("")).join("")}</div></div>`;
  if(R.length){
    const byB={};R.forEach(r=>(byB[r.b]=byB[r.b]||[]).push(r.lv));
    h+=`<div class="card" style="margin-top:12px"><div class="eyebrow m">Cómo se reparte cada bloque</div><p class="sm mut" style="margin-top:6px">Qué parte de cada bloque fue Bajo, Alto o Máximo esta semana. A la derecha, el promedio.</p><div class="leg">${[1,2,3].map(n=>`<span><i style="background:var(--lv${n})"></i>${L[n].n}</span>`).join("")}</div>${B.map((_,i)=>{const a=byB[i+1]||[];return`<div class="bar"><span class="nm">Bloque ${i+1}</span><div class="trk">${a.length?[1,2,3].map(n=>{const c=a.filter(x=>x===n).length;return c?`<i style="width:${c/a.length*100}%;background:var(--lv${n})" title="${L[n].n}: ${c}"></i>`:""}).join(""):""}</div><span class="v tab">${a.length?f1(mean(a)):"–"}</span></div>`}).join("")}</div>`;
  }
  wd.forEach(d=>{
    if(d>today)return;
    const rows=B.map((_,i)=>({i,r:logs[id(d,i)]})),c=rows.filter(o=>o.r&&o.r.lv>=1&&o.r.lv<=3).length;
    if(!c){h+=`<div class="dd empty-d"><div class="row"><b style="font-weight:800">${longDate(d)}</b><span class="chip">Sin registros</span></div></div>`;return}
    const o=!!wkOpen[d];
    h+=`<section class="dd"><button type="button" class="dacc${o?" o":""}" data-a="wkd" data-d="${d}" aria-expanded="${o}"><span class="t"><h3>${longDate(d)}</h3><span class="sub tab">${c} de 5 bloques registrados</span></span><span class="ps" aria-hidden="true">${rows.map(({r})=>`<i class="${r&&r.lv>=1&&r.lv<=3?"l"+r.lv:""}"></i>`).join("")}</span>${ic.chr}</button>${o?rows.map(({i,r})=>r&&r.lv>=1&&r.lv<=3?`<div class="dr"><span class="bn l${r.lv}">${i+1}</span><div class="tx"><b>${esc(r.act||"Sin actividad")}</b><span class="tab">${rng(i)}${r.ar?" · "+AR[r.ar].s:""}</span></div>${pill(r.lv)}</div>`:`<div class="dr no"><span class="bn">${i+1}</span><div class="tx"><b>Sin registro</b><span class="tab">${rng(i)}</span></div></div>`).join(""):""}</section>`;
  });
  return h;
}

/* ---------- Historial (calendario) ---------- */
function histBtn(){
  const R=recs(),n=R.length,d=new Set(R.map(r=>r.date)).size;
  return`<button type="button" class="hbtn" data-a="calopen" aria-label="Revisar el historial">${ic.cal}<span class="tx"><span class="t">Revisar el historial</span><span class="s">${n?`${n} registro${n>1?"s":""} en ${d} día${d>1?"s":""}. Míralos en un calendario.`:"Aquí verás tus días en un calendario."}</span></span>${ic.chr.replace("<svg ",'<svg style="width:22px;height:22px" ')}</button>`;
}
function calHtml(){
  const[y,mo]=sheet.m.split("-").map(Number),today=dk(new Date()),curM=today.slice(0,7);
  const by={};recs().forEach(r=>{(by[r.date]=by[r.date]||{})[r.b]=r.lv});
  const first=new Date(y,mo-1,1),lead=(first.getDay()+6)%7,nd=new Date(y,mo,0).getDate();
  const title=cap(first.toLocaleDateString("es-CO",{month:"long",year:"numeric"}));
  let mr=0,md=0,sum=0,hd=0;
  for(let i=1;i<=nd;i++){const d=sheet.m+"-"+pad(i),x=by[d];if(x){const v=Object.values(x);mr+=v.length;md++;sum+=v.reduce((p,q)=>p+q,0)}
    const hv=habs[d];if(hv&&HAB.some(k=>hv[k.k]!==undefined))hd++}
  let g="";
  for(let i=0;i<lead;i++)g+=`<span class="cd out" aria-hidden="true"></span>`;
  for(let i=1;i<=nd;i++){
    const d=sheet.m+"-"+pad(i),x=by[d]||{},c=Object.keys(x).length,hv=habs[d],hh=hv&&HAB.some(k=>hv[k.k]!==undefined),fut=d>today;
    g+=`<button type="button" class="cd${c?" has":""}${d===today?" td":""}${d===sheet.sel?" sel":""}${fut?" fut":""}" data-a="calsel" data-d="${d}" ${fut?"disabled":""} aria-pressed="${d===sheet.sel}" aria-label="${longDate(d)}: ${c} de 5 registros">${hh?'<i class="hb"></i>':""}<span class="dn">${i}</span><span class="ps">${[1,2,3,4,5].map(b=>`<i class="${x[b]?"l"+x[b]:""}"></i>`).join("")}</span><span class="ct">${c?c+"/5":"–"}</span></button>`;
  }
  let h=`<div class="row"><div><div class="eyebrow">Historial</div><h2 class="h2">Tu calendario</h2></div><button type="button" class="btn sm" data-a="close">Listo</button></div>
  <div class="cal-h"><button type="button" class="cal-n" data-a="calnav" data-v="-1" aria-label="Mes anterior">${ic.chl}</button><b>${title}</b><button type="button" class="cal-n" data-a="calnav" data-v="1" aria-label="Mes siguiente" ${sheet.m>=curM?"disabled":""}>${ic.chr}</button></div>
  <div class="cal-w" aria-hidden="true">${["L","M","M","J","V","S","D"].map(l=>`<span>${l}</span>`).join("")}</div>
  <div class="cal-g">${g}</div>
  <div class="leg">${[1,2,3].map(n=>`<span><i style="background:var(--lv${n})"></i>${L[n].n}</span>`).join("")}<span><i style="background:var(--line)"></i>Sin registro</span></div>
  <p class="sm mut" style="margin-top:8px">Cada barrita es un bloque (del 1 al 5). Abajo ves cuántos registraste. El punto azul marca que respondiste hábitos.</p>
  <div class="msum"><div><b class="tab">${mr}</b><span>registros</span></div><div><b class="tab">${md}</b><span>día${md===1?"":"s"} con datos</span></div><div><b class="tab">${md?f1(sum/mr):"–"}</b><span>promedio de 3</span></div></div>`;
  if(!sheet.sel)return h+`<div class="empty" style="margin-top:18px;padding:24px 16px"><b>Toca un día</b>Verás qué registraste en cada bloque.</div>`;
  const d=sheet.sel,x=by[d]||{},c=Object.keys(x).length,hv=habs[d]||{};
  h+=`<section class="dd" aria-label="Detalle del día"><h3>${longDate(d)}</h3><div class="sub tab">${c} de 5 bloques registrados</div>`;
  if(HAB.some(k=>hv[k.k]!==undefined))h+=`<div class="dh" aria-label="Hábitos del día">${HAB.map(k=>`<span><i class="${hv[k.k]===1?"y":hv[k.k]===0?"n":"z"}">${hv[k.k]===1?ic.ok:hv[k.k]===0?ic.no:""}</i>${k.n}</span>`).join("")}</div>`;
  B.forEach((_,i)=>{
    const r=logs[id(d,i)],k=id(d,i);
    if(r&&r.lv>=1&&r.lv<=3)h+=`<div class="dr"><span class="bn l${r.lv}">${i+1}</span><div class="tx"><b><span class="pill l${r.lv}" style="margin-right:8px">${L[r.lv].n}</span><span class="tab" style="display:inline;font-weight:600;color:var(--mut);font-size:12px">${rng(i)}</span></b><span>${meta(r)}</span></div><button class="del" type="button" data-a="del" data-k="${k}">${armed===k?"¿Seguro?":"Eliminar"}</button></div>`;
    else h+=`<div class="dr no"><span class="bn">${i+1}</span><div class="tx"><b>Sin registro</b><span class="tab">${rng(i)}</span></div></div>`;
  });
  return h+`</section>`;
}

function render(){
  $("#app").innerHTML=tab==="hoy"?hoy():tab==="se"?se():tab==="an"?an():foc();
  $("#nav").firstElementChild.innerHTML=NAV.map(([k,n,p])=>`<button type="button" class="${tab===k?"on":""}" data-a="tab" data-v="${k}" aria-label="${n}" title="${n}" ${tab===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg></button>`).join("");
  syncSw();if(sheet&&sheet.t==="cal")renderSheet();
}
setInterval(()=>{renderTop();if(tab==="hoy"&&!sheet)render()},30000);
init();
