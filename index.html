<style>
/* Concepto: panel de control sobre cuadrícula tenue. Midnight / Ice White de fondo. Victory Blue #3B82F6 fijo en títulos y botones (claro u oscuro). Rojo, verde, naranja y morado solo con significado. */
:root{
  --bg:#111827;--bg2:#0B1220;--bg3:#172033;--line:#374151;
  --tx:#F9FAFB;--tx2:#D1D5DB;--mut:#9CA3AF;
  --ac:#3B82F6;--act:#3B82F6;--acs:rgba(59,130,246,.18);
  --red:#EF4444;--grn:#22C55E;--org:#F59E0B;--pur:#A855F7;
  --lv1:var(--red);--lv2:var(--ac);--lv3:var(--org);--onlv:#FFFFFF;--onred:#FFFFFF;
  --grid:rgba(55,65,81,.35);--sh:0 12px 28px -16px rgba(0,0,0,.7);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Cambria,Caladea,Georgia,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F9FAFB;--bg2:#FFFFFF;--bg3:#F1F5F9;--line:#D1D5DB;
    --tx:#111827;--tx2:#374151;--mut:#4B5563;--acs:rgba(59,130,246,.12);
    --grid:rgba(17,24,39,.06);--sh:0 12px 28px -18px rgba(17,24,39,.35);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F9FAFB;--bg2:#FFFFFF;--bg3:#F1F5F9;--line:#D1D5DB;
  --tx:#111827;--tx2:#374151;--mut:#4B5563;--acs:rgba(59,130,246,.12);
  --grid:rgba(17,24,39,.06);--sh:0 12px 28px -18px rgba(17,24,39,.35);color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background-color:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px;
  padding-block:14px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:680px;margin-inline:auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
h1,h2,h3,p{margin:0}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.eyebrow:not(.m)::before{content:"";flex:none;width:16px;height:3px;border-radius:2px;background:var(--ac)}
.eyebrow.m{color:var(--mut)}
.big{font-size:38px;line-height:1.02;font-weight:800;letter-spacing:-.03em;text-transform:uppercase;margin-top:8px;color:var(--ac)}
.big::after{content:"";display:block;width:48px;height:4px;border-radius:2px;background:var(--ac);margin-top:16px}
.big span{display:block;font-size:15px;letter-spacing:.02em;color:var(--mut);font-weight:600;text-transform:none;margin-top:8px}
.h2{font-size:24px;line-height:1.1;font-weight:800;letter-spacing:-.025em;margin-top:6px;color:var(--ac)}
.sec{margin-top:34px}
.lede{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--tx2);margin-top:8px;max-width:60ch}
.sm{font-size:13px}.mut{color:var(--mut)}
.tab{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px;padding-bottom:18px}
.who{display:flex;align-items:center;gap:12px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left;border-radius:14px}
.who .tx{min-width:0;display:grid;gap:1px}
.who .g{font-size:13px;font-weight:600;color:var(--mut);line-height:1.25}
.who .n{color:var(--ac);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .n.ask{font-size:16px;color:var(--act);text-decoration:underline;text-underline-offset:3px}
.av{display:grid;place-items:center;flex:none;border-radius:50%;border:2px solid var(--ac);overflow:hidden;background:#0B1220;color:#F9FAFB;font-weight:800}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.gear{position:relative}
.gear .dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--grn);border:2px solid var(--bg3)}
.gear .dot.off{background:var(--org)}
.avs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.avp{background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:12px 6px;display:grid;justify-items:center;gap:8px;min-height:44px}
.avp.on{border-color:var(--ac);background:var(--bg3)}
.avp .sm{font-weight:600;text-align:center}
.avp.on .sm{font-weight:800}
.ck svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--act)}
.acct{display:grid;gap:14px}
.acct .r2{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acct .r2+.r2{border-top:1px solid var(--line);padding-top:14px}
.acct b{font-weight:800}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--ac);color:#fff;font-weight:800;min-height:44px;box-shadow:0 10px 20px -12px var(--ac)}
.btn.g{box-shadow:none}
.btn.g{background:var(--bg3);color:var(--tx);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;padding:10px 0;font-size:13px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-block;font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;color:var(--onlv);white-space:nowrap}
.pill.l1{background:var(--lv1)}.pill.l2{background:var(--lv2)}.pill.l3{background:var(--lv3)}
.chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.act{color:var(--act);border-color:var(--ac)}
.meter{display:flex;gap:6px;margin-top:18px}
.meter i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.banner{margin-top:18px;border:1px solid var(--ac);border-radius:20px;padding:18px;background:var(--bg2);display:grid;gap:10px}
.banner b{font-weight:800;font-size:18px;letter-spacing:-.01em}
.hab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hab:first-of-type{border-top:0}
.hab span{font-weight:700}
.yn{display:flex;gap:8px}
.yb{width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--mut);display:grid;place-items:center}
.yb.on.ok{background:var(--grn);border-color:var(--grn);color:var(--onlv)}
.yb.on.no{background:var(--red);border-color:var(--red);color:var(--onred)}
.seg{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 10px;min-height:40px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--ac);color:#fff}
.blk{display:grid;gap:10px}
.blk .n{font-weight:800;font-size:17px;letter-spacing:-.01em}
.blk .r{color:var(--mut);font-size:13px}
.del{background:none;border:0;color:var(--red);font-weight:700;font-size:13px;padding:10px 0 10px 10px;min-height:44px}
.pzc{width:100%;margin-top:12px;display:flex;align-items:center;gap:14px;text-align:left;background:var(--bg2);border:1.5px solid var(--org);border-radius:20px;padding:12px 14px;color:var(--tx);min-height:64px}
.pzc .bd{flex:none;background:var(--org);color:#241600;font-weight:900;letter-spacing:.12em;font-size:14px;border-radius:12px;padding:10px 12px}
.pzc b{display:block;font-size:15px;font-weight:800}
.pzc span.s{display:block;margin-top:2px;font-size:13px;color:var(--mut);line-height:1.35}
.pzs{display:grid;grid-template-columns:44px 1fr;gap:14px;margin-top:18px;align-items:start}
.pzs .lt{width:44px;height:44px;border-radius:14px;background:var(--org);color:#241600;font-weight:900;font-size:22px;display:grid;place-items:center}
.pzs b{display:block;font-size:16px;font-weight:800}
.pzs p{margin-top:4px;color:var(--mut);font-size:14px;line-height:1.45}
.pzs ul{margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:14px;line-height:1.5}
.pzs li+li{margin-top:5px}
textarea.na{width:100%;resize:none;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:76px;font:inherit;color:var(--tx);line-height:1.4}
.plg{border:1.5px solid var(--ac);background:var(--bg2);border-radius:20px;padding:16px;margin-top:20px}
.plg .tip{margin-top:8px;font-size:13px;color:var(--mut);line-height:1.45}
.plb{margin-top:12px}
.plb .hd{display:flex;align-items:center;gap:12px}
.plb .tk{margin-top:12px}
.plb .tk .seg{margin-top:0}
.plb input.na{width:100%;margin-top:12px}
.plb .tt{font-weight:800;font-size:16px}
.plb .nt{font-size:13px;color:var(--mut);margin-top:2px}
.plb .none{color:var(--mut);font-size:14px}
.plgo{font-size:20px;line-height:1.35;font-weight:800;margin-top:8px;color:var(--tx)}
.blk .n:has(.plt){display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
.plt{font-size:13px;font-weight:700;color:var(--ac);white-space:nowrap}
.plt2{font-size:13px;color:var(--mut);margin-top:2px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg2);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav div{max-width:680px;margin:auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:none;min-height:46px;border-radius:12px;font-weight:700;font-size:13px;color:var(--mut)}
.nav button.on{background:var(--acs);color:var(--act)}
.nav button{position:relative}
.nav button.on::after{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.nav button{display:grid;place-items:center}
.nav button svg{width:26px;height:26px}
.tools{display:flex;gap:8px;align-items:center}
.sw{position:relative;width:68px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg3);padding:0;flex:none}
.sw .k{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;background:var(--ac);transition:transform .2s}
.sw[aria-checked="true"] .k{transform:translateX(28px)}
.sw svg{position:absolute;top:11px;width:16px;height:16px;color:var(--mut)}
.sw .s1{left:11px}.sw .s2{left:39px}
.sw[aria-checked="false"] .s1,.sw[aria-checked="true"] .s2{color:#fff}
.ib2{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);display:grid;place-items:center;flex:none}
.arow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.ar{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:8px 2px;min-height:58px;display:grid;place-items:center;text-align:center}
.ar b{font-weight:800;font-size:17px;line-height:1}
.ar span{font-size:10px;font-weight:600;color:var(--mut);line-height:1.1}
.ar.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ar.on span{color:#fff}
.ex{border-top:1px solid var(--line);padding:16px 0}
.ex:first-child{border-top:0;padding-top:4px}
.ex .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex .hd b{font-weight:800;font-size:17px}
.ex2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.exc{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;min-width:0}
.exc b{font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em}
.mini{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px}
.tips{display:grid;gap:12px;margin-top:14px}
.tip{border:1px solid var(--line);background:var(--bg2);border-radius:20px;padding:18px}
.tip.hot{border-color:var(--ac)}
.tip h3{font-weight:800;font-size:19px;letter-spacing:-.015em;margin-top:6px}
.tip p{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--tx2);margin-top:8px}
.tip ul{margin:12px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--tx2)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.kpi{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--bg2);border-radius:18px;padding:16px 14px 14px;box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--kc,var(--ac))}
.kpi.k2{--kc:var(--grn)}.kpi.k3{--kc:var(--org)}
.kpi b{display:block;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.kpi b small{font-size:14px;color:var(--mut);font-weight:600;letter-spacing:0}
.kpi p{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.35}
.ins-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
.ins{border:1px solid var(--line);background:var(--bg2);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--sh)}
.ins .k{gap:8px}.ins .k i{flex:none;width:10px;height:10px;border-radius:50%}
.ins .t{font-weight:800;font-size:19px;line-height:1.2;letter-spacing:-.015em;margin-top:8px}
.ins .s{font-family:var(--serif);font-size:15px;color:var(--tx2);margin-top:6px;line-height:1.45}
.heat{display:grid;grid-template-columns:36px repeat(5,minmax(0,1fr)) 46px;gap:5px;margin-top:14px;align-items:center}
.hc{font-size:11px;font-weight:600;color:var(--mut);text-align:center}
.hr{font-size:12px;font-weight:700;color:var(--mut)}
.cell{border-radius:10px;min-height:46px;display:grid;place-content:center;text-align:center;font-weight:800;font-size:15px;line-height:1.1}
.cell small{font-size:10px;font-weight:600;opacity:.8}
.cell.e{border:1px dashed var(--line);color:var(--mut);font-weight:600}
.cell.p{background:var(--bg3);border:1px solid var(--line)}
.scale{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--mut)}
.scale i{flex:1;height:8px;border-radius:4px;max-width:180px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 54px;gap:10px;align-items:center;margin-top:10px;font-size:13px}
.bar.w{grid-template-columns:118px minmax(0,1fr) 62px}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.trk{height:20px;border-radius:6px;background:var(--bg3);display:flex;gap:2px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:4px;min-width:0}
.trk i.one{background:var(--ac)}
.bar .v{text-align:right;font-weight:800}
.bar .v small{font-weight:600;color:var(--mut)}
.bar.low{opacity:.6}
.db{margin-top:18px}
.db .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.db .hd b{font-weight:800;font-size:16px}
.db .dl{font-weight:800;font-size:20px;letter-spacing:-.02em}
.db .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:2px}
.db .st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tr{position:relative;height:30px;margin:6px 10px 0}
.tr .ln{position:absolute;top:14px;height:3px;border-radius:2px;background:var(--line)}
.tr .base{position:absolute;left:0;right:0;top:14px;height:3px;background:var(--bg3);border-radius:2px}
.tr .d{position:absolute;top:7px;width:17px;height:17px;border-radius:50%;transform:translateX(-50%)}
.tr .d.y{background:var(--grn);border:3px solid var(--bg2);box-shadow:0 0 0 1px var(--grn)}
.tr .d.n{background:var(--bg2);border:3px solid var(--red)}
.axis{position:relative;height:16px;margin:0 10px;font-size:11px;color:var(--mut)}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;height:190px;align-items:end;margin-top:16px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.col .b{width:100%;border-radius:8px 8px 3px 3px;background:var(--ac);min-height:3px}
.col.e .b{background:var(--bg3)}
.col .v{font-weight:800;font-size:16px}
.cl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px;text-align:center;font-size:12px;color:var(--mut)}
.cl b{display:block;color:var(--tx);font-size:13px}
.prog{height:10px;border-radius:5px;background:var(--bg3);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:5px}
.svgw{overflow-x:auto;margin-top:10px}
.sv{display:block;width:100%;height:auto;min-width:300px}
.sv-t{fill:var(--mut);font:600 9px var(--sans)}
.sv-v{fill:var(--tx);font:800 11px var(--sans)}
.sv-g{stroke:var(--line);stroke-width:1}
.sv-l{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sv-a{fill:var(--ac);opacity:.14}
.sv-p{fill:var(--ac);stroke:var(--bg2);stroke-width:2}
.sv-y{fill:var(--grn)}
.sv-n{fill:none;stroke:var(--red);stroke-width:2}
.sv-0{fill:var(--line)}
.hist-d{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.hist-d h3{font-weight:800;font-size:16px;letter-spacing:-.01em}
.mk{display:flex;gap:5px}
.mk i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.mk i svg{width:13px;height:13px}
.mk .y{background:var(--grn);color:var(--onlv)}.mk .n{background:var(--red);color:var(--onred)}.mk .z{background:var(--bg3);border:1px solid var(--line)}
.empty{border:1px dashed var(--line);border-radius:20px;padding:34px 20px;text-align:center;color:var(--mut);margin-top:24px}
.empty b{display:block;color:var(--tx);font-weight:800;font-size:18px;margin-bottom:6px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,7,18,.66);display:flex;align-items:flex-end;justify-content:center}

.xh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.xh b{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.xh span{font-size:12px;color:var(--mut)}
.xsb{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.xsl{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mut);padding-top:8px}
.xsl svg{width:12px;height:12px}
.xgh{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.xgh b{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.xgh span{font-size:12px;color:var(--mut)}
.xpc{margin-top:12px;padding:12px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);display:grid;gap:8px}
.xsws{display:grid;gap:10px}
.xsl2{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.xsw button{font-size:13px;min-height:38px}
.xadd{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}

.xmenu{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.xmi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);min-height:68px}
.xmic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acs);color:var(--act);display:grid;place-items:center}
.xmic svg{width:22px;height:22px}
.xmt{flex:1;min-width:0;display:flex;flex-direction:column}
.xmt b{font-size:16px;font-weight:800}
.xmt span{font-size:12.5px;color:var(--mut);margin-top:2px}
.xmc{flex:none;color:var(--mut);display:grid}
.xmc svg{width:18px;height:18px}
.xbk{display:flex;align-items:center;gap:10px;min-width:0}
.xbk .h2{margin:0}
.card.sk{border-left:4px dashed var(--line)}

.xsk{display:block;width:100%;margin-top:14px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-weight:600;font-size:14px}
.xsk:active{transform:scale(.98)}
.xpm{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);text-align:left;min-height:56px}
.xpn{flex:1;min-width:0;display:flex;flex-direction:column}
.xpn b{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpn span{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpc2{flex:none;color:var(--mut);display:grid}.xpc2 svg{width:18px;height:18px;transform:rotate(90deg)}
.xpx{justify-self:end;background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:2px 0;min-height:28px}

.xsch{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);text-align:left;min-height:60px}
.xsi{flex:none;width:38px;height:38px;border-radius:11px;background:var(--acs);color:var(--act);display:grid;place-items:center}
.xsi svg{width:20px;height:20px}
.xst{flex:1;min-width:0;display:flex;flex-direction:column}
.xst b{font-size:15px;font-weight:800}
.xst span{font-size:12.5px;color:var(--mut);margin-top:1px}
.xsc{flex:none;color:var(--mut);display:grid}.xsc svg{width:18px;height:18px}
.xsum{display:flex;flex-direction:column;margin-top:16px}
.xsum b{font-size:18px;font-weight:800}.xsum span{font-size:13px;color:var(--mut)}
.xtl{margin-top:12px}
.xtb{position:relative;height:34px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);overflow:hidden}
.xtb i{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--ac);color:#fff;font-style:normal;font-weight:800;font-size:12px;display:grid;place-items:center;outline:1px solid var(--bg3);min-width:2px}
.xtb i.bad{background:var(--red)}
.xta{position:relative;height:18px;margin-top:4px;font-size:11px;color:var(--mut)}
.xta span{position:absolute;transform:translateX(-50%)}
.xta span:first-child{transform:none}
.xbl{margin-top:12px;max-height:46vh;overflow-y:auto;display:grid;gap:8px;padding-right:2px;-webkit-overflow-scrolling:touch}
.xbr{display:grid;grid-template-columns:38px minmax(0,1.15fr) minmax(0,1fr) 46px;gap:8px;align-items:end;padding:10px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.xbr.bad{border-color:var(--red)}
.xbr .bn{align-self:end;margin-bottom:2px}
.xf{display:flex;flex-direction:column;gap:3px;min-width:0}
.xf span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.xf input::-webkit-calendar-picker-indicator{display:none}
.xf input,.xf select{width:100%;min-width:0;min-height:44px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:0 8px;color:var(--tx);font:inherit;font-size:14px;font-variant-numeric:tabular-nums}
.xbe{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--mut)}
.xbr.bad .xbe{color:var(--red);font-weight:600}
.xvs{margin-top:20px;font-size:13px;color:var(--mut)}
.xvs summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.xvs ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.xvs li{display:flex;flex-direction:column;padding:8px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.xvs li b{color:var(--tx);font-size:13px}
.heatw{overflow-x:auto}
.wcell.n{border:0;background:none}
.cd .ps{width:100%;justify-content:center}
.cd .ps i{flex:1 1 0;max-width:5px;min-width:1px}
.dacc .ps{max-width:140px}.dacc .ps i{flex:0 1 6px;min-width:1px}

.xtm{width:100%;min-height:44px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-weight:700;font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.xwh{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;height:132px;margin-top:18px}
.xwb{position:absolute;left:0;right:0;top:44px;height:44px;border-radius:12px;background:var(--acs);border:1px solid var(--ac);pointer-events:none}
.xw{position:relative;z-index:1;height:132px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.xw::-webkit-scrollbar{display:none}
.xws{height:44px}
.xwi{height:44px;display:grid;place-items:center;scroll-snap-align:center;font-size:21px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;cursor:pointer}
.xwi.on{color:var(--tx);font-weight:800}
.hc small{font-weight:600;opacity:.75;font-size:10px}

.heat.t{gap:4px}
.heat.t .cell{min-height:42px;font-size:13px;border-radius:8px}
.heat.t .cell small{font-size:8.5px}
.heat.t .hr{font-size:11px;line-height:1.1;display:flex;flex-direction:column}
.heat.t .hr small{font-size:9px;font-weight:600;opacity:.75}
.heat.t .hc{font-size:10.5px}
</style>

    const items={};if(it&&typeof it==="object")Object.keys(it).forEach(b=>{const x=it[b];if(!x)return;const a=String(x.a||"").slice(0,40),n=String(x.n||"").slice(0,120);if(a||n||x.c==="p")items[String(b).slice(0,40)]={c:x.c==="p"?"p":"w",a,n}});

 hab(d){const cur=(habs[d.d]||{})[d.k],v=+d.v;setHab(d.d,d.k,cur===v?null:v)},
 open(d){sheet={t:"reg",d:d.d,i:+d.i,lv:0,ar:0,act:"",cat:"w"};sheetBack=null;renderSheet()},
 lv(d){sheet.lv=+d.v;renderSheet()},
 skopen(){sheet.sk=true;sheet.why="";sheet.note="";renderSheet()},
 skback(){sheet.sk=false;renderSheet()},
 skwhy(d){const n=$("#sknote");if(n)sheet.note=n.value;sheet.why=sheet.why===d.v?"":d.v;renderSheet()},
 sksave(){const n=$("#sknote");const note=n?n.value.trim():"";if(!sheet.why)return;const why=sheet.why+(note?": "+note:"");putSkip(sheet.d,sheet.i,why);sheet=null;sheetBack=null;renderSheet();toast("Bloque marcado como sin trabajar.")},
 cat(d){sheet.cat=d.v;sheet.act="";renderSheet()},
 pick(d){const a=acts[sheet.cat][+d.k];sheet.act=sheet.act===a?"":a;renderSheet()},
 save(){if(!sheet.lv)return;put(sheet.d,sheet.i,sheet.lv,sheet.act,sheet.cat,sheet.ar);sheet=null;sheetBack=null;renderSheet()},
 pzopen(){sheet={t:"pz"};sheetBack=null;renderSheet()},
 close(){
   if(sheet&&sheet.t==="sch"&&sheet.tp){sheet.tp=null;renderSheet();return}
   if(sheet&&sheet.t==="set")commitName();
   if(sheet&&sheet.t==="edit"&&sheetBack){sheet=sheetBack;sheetBack=null;if(sheet.t==="reg"&&!acts[sheet.cat].includes(sheet.act))sheet.act="";renderSheet()}
   else{sheet=null;sheetBack=null;renderSheet()}
 },
 del(d){arm(d.k)},
 openedit(){if(sheet&&sheet.t==="set")commitName();sheetBack=sheet;sheet={t:"edit",cat:sheetBack.cat||"w",arm:null,mode:"",cf:null,ren:null};renderSheet()},
 openedit0(){sheetBack=null;sheet={t:"edit",cat:"w",arm:null,mode:"",cf:null,ren:null};renderSheet()},
 ecat(d){sheet.cat=d.v;sheet.arm=null;sheet.cf=null;sheet.ren=null;renderSheet()},
 emode(d){sheet.mode=sheet.mode===d.v?"":d.v;sheet.cf=null;sheet.ren=null;sheet.arm=null;renderSheet();if(sheet.mode==="add"){const n=$("#newact");if(n)n.focus()}},
 eren(d){sheet.ren=+d.k;sheet.mode="";sheet.cf=null;renderSheet();const n=$("#ren");if(n){n.focus();n.select()}},
 rensave(){const i=$("#ren");if(!i||sheet.ren==null)return;const k=sheet.ren;sheet.ren=null;renameAct(k,i.value)},
 rencancel(){sheet.ren=null;renderSheet()},
 delact(d){sheet.cf=+d.k;renderSheet()},
 delno(){sheet.cf=null;renderSheet()},
 delok(){
   const k=sheet.cf;if(k==null||!acts[sheet.cat][k]){sheet.cf=null;renderSheet();return}
   acts[sheet.cat].splice(k,1);sheet.cf=null;saveActs();renderSheet();toast("Actividad eliminada. Tus registros no cambian.");
 },
 addact(){
   const i=$("#newact");if(!i)return;const v=i.value.trim();if(!v)return;
   if(acts[sheet.cat].some(a=>a.toLowerCase()===v.toLowerCase())){toast("Ya existe esa actividad.",1);return}
   acts[sheet.cat].push(v);sheet.arm=null;saveActs();renderSheet();
   const n=$("#newact");if(n)n.focus();
 },
 resetacts(){
   if(sheet.arm==="reset"){acts[sheet.cat]=DEF[sheet.cat].slice();sheet.arm=null;saveActs();renderSheet();return}
   sheet.arm="reset";renderSheet();setTimeout(()=>{if(sheet&&sheet.t==="edit"&&sheet.arm==="reset"){sheet.arm=null;renderSheet()}},3500);
 }
};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");
  if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset);return}
  if(e.target.classList&&e.target.classList.contains("sheet"))A.close();
});
document.addEventListener("change",e=>{const t=e.target;if(!t.classList||!sheet||sheet.t!=="sch")return;
  if(t.classList.contains("sch-s")){const b=sheet.draft[+t.dataset.k];if(!b||!TRe.test(t.value||""))return;
    let m=Math.round(mins(t.value)/15)*15;m=Math.max(0,Math.min(SCH_END-SCH_MIN,m));b.s=m;if(b.s+b.dur>SCH_END)b.dur=Math.max(SCH_MIN,Math.floor((SCH_END-b.s)/15)*15);
    sheet.draft=schNorm(sheet.draft);renderSheet()}
  else if(t.classList.contains("sch-d")){const b=sheet.draft[+t.dataset.k];if(!b)return;b.dur=Math.max(SCH_MIN,+t.value||SCH_MIN);sheet.draft=schNorm(sheet.draft);renderSheet()}
  else if(t.id==="schfrom"){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){if(t.value<schMin()){toast("Elige una fecha desde "+shortD(schMin())+".",1);sheet.from=schMin()}else sheet.from=t.value}renderSheet()}
});
/* Barra de excitación: se actualiza en el lugar para que el botón se pueda arrastrar */
function arUpd(){
  const r=$("#arr");if(!r||!sheet)return;const v=sheet.ar;
  r.classList.toggle("unset",!v);if(v)r.value=v;
  document.querySelectorAll(".xtk").forEach(b=>{const n=+b.dataset.v;b.classList.toggle("on",n===v);b.setAttribute("aria-pressed",String(n===v))});
  const d=$("#ard");if(d)d.textContent=v?AR[v].d:"Desliza el botón o toca un número. Es opcional.";
  const c=$("#arclr");if(c)c.hidden=!v;
}
function arSet(e){const r=e.target;if(!r||r.id!=="arr"||!sheet||sheet.t!=="reg")return;sheet.ar=+r.value;arUpd()}
document.addEventListener("input",arSet);
document.addEventListener("input",e=>{const el=e.target;if(!el||tab!=="pl")return;const t=plD();
  if(el.id==="plg"){const p=getPlan(t);p.goal=el.value;savePlanLater(t);const b=$("#plcl"),h=$("#plh");if(b)b.disabled=!p.goal.trim();if(h)h.hidden=!!p.goal.trim()}
  else if(el.classList&&el.classList.contains("plnote")){const p=getPlan(t),b=el.dataset.b,x=p.items[b]||(p.items[b]={c:"w",a:"",n:""});x.n=el.value;savePlanLater(t)}});
document.addEventListener("change",arSet);
document.addEventListener("pointerup",e=>{if(e.target&&e.target.id==="arr")arSet(e)});
document.addEventListener("keyup",e=>{if(e.target&&e.target.id==="arr")arSet(e)});
document.addEventListener("change",e=>{const t=e.target;if(!t.classList||!sheet||sheet.t!=="proj")return;const i=+t.dataset.i,p=projs[i];if(!p)return;
  if(t.classList.contains("pn")){const v=t.value.trim();if(v){p.n=v.slice(0,40);saveProjs();render()}else t.value=p.n}
  else if(t.classList.contains("pd")){p.d=t.value.trim().slice(0,60);saveProjs();render()}});
document.addEventListener("input",e=>{if(e.target&&e.target.id==="nm"&&sheet&&sheet.t==="set")sheet.nm=e.target.value;if(e.target&&e.target.id==="sknote"&&sheet)sheet.note=e.target.value;if(e.target&&e.target.id==="impc"&&sheet&&sheet.t==="set")sheet.imp=e.target.value});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Enter"){
    if(t.id==="newact"){e.preventDefault();A.addact()}
    else if(t.id==="newproj"||t.id==="newprojd"){e.preventDefault();A.padd()}
    else if(t.id==="sknote"){e.preventDefault();A.sksave()}
    else if(t.id==="nm"){e.preventDefault();A.savename()}
    else if(t.id==="ren"){e.preventDefault();A.rensave()}
  }
  if(e.key==="Escape"&&sheet)A.close();
});

function pearson(xs,ys){const n=xs.length;if(n<3)return null;const mx=mean(xs),my=mean(ys);let a=0,b=0,c=0;for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;a+=dx*dy;b+=dx*dx;c+=dy*dy}return b&&c?a/Math.sqrt(b*c):null}

function fitQuad(p){
  let s1=0,s2=0,s3=0,s4=0,t0=0,t1=0,t2=0;const n=p.length;
  p.forEach(([x,y])=>{s1+=x;s2+=x*x;s3+=x**3;s4+=x**4;t0+=y;t1+=x*y;t2+=x*x*y});
  const M=[[s4,s3,s2,t2],[s3,s2,s1,t1],[s2,s1,n,t0]];
  for(let i=0;i<3;i++){
    let q=i;for(let r=i+1;r<3;r++)if(Math.abs(M[r][i])>Math.abs(M[q][i]))q=r;
    [M[i],M[q]]=[M[q],M[i]];if(Math.abs(M[i][i])<1e-9)return null;
    for(let r=0;r<3;r++)if(r!==i){const f=M[r][i]/M[i][i];for(let c=i;c<4;c++)M[r][c]-=f*M[i][c]}
  }
  return{a:M[0][3]/M[0][0],b:M[1][3]/M[1][1],c:M[2][3]/M[2][2]};
}

function foc(){
  const R=recs().filter(r=>r.ar),n=R.length,byA={};
  R.forEach(r=>(byA[r.ar]=byA[r.ar]||[]).push(r.lv));
  const nl=Object.keys(byA).length;
  let fit=null,peak=null;
  if(n>=8&&nl>=3){const q=fitQuad(R.map(r=>[r.ar,r.lv]));if(q&&q.a<-0.02)fit=q}
  if(fit)peak=Math.max(1,Math.min(5,-fit.b/(2*fit.a)));
  else if(n>=3){const b=best(byA,2,1)||best(byA,1,1);if(b)peak=+b.k}
  const pos=peak==null?null:peak<2.6?"izq":peak>3.4?"der":"cen";
  const rec=R.slice().sort((a,b)=>a.date===b.date?b.b-a.b:a.date<b.date?1:-1).slice(0,5),ra=mean(rec.map(r=>r.ar));
  const st=peak==null||ra==null?null:ra<peak-.5?"low":ra>peak+.5?"high":"ok";
  let h=`<div class="eyebrow">Modo focus</div><h1 class="big">Tu punto ideal<span>Cuánta excitación necesitas para rendir al máximo</span></h1>
  <p class="lede">Más presión no siempre da más rendimiento. Con muy poca excitación te aburres y avanzas poco. Con demasiada te bloqueas. En el medio está tu mejor punto, y cambia de una persona a otra. Esta idea se conoce como la ley de Yerkes-Dodson, descrita en 1908. La curva tiene forma de U invertida.</p>`;
  h+=`<div class="card" style="margin-top:18px"><div class="leg" style="margin:0 0 4px"><span><i style="background:var(--mut);border-radius:50%;opacity:.75"></i>Curva de referencia</span>${fit?`<span><i style="background:var(--ac);border-radius:50%"></i>Tu curva</span>`:""}<span><i style="background:var(--ac);border-radius:50%;opacity:.6"></i>Tu promedio por nivel</span></div><div class="svgw">${focChart(byA,fit,peak)}</div></div>`;
  if(peak==null){
    h+=`<div class="empty"><b>Aún no hay curva</b>${n?`Llevas ${n} registro${n===1?"":"s"} con excitación. Con 3 se marca un primer pico y con 8, repartidos en 3 niveles distintos, se dibuja tu curva.`:"Al registrar un bloque, elige también tu nivel de excitación (es opcional). Así descubrimos cuál te funciona mejor."}</div>`;
  }else{
    const nm=AR[Math.round(peak)].s,tx={izq:["a la izquierda","Rindes mejor con una excitación baja o moderada. Con mucha presión empiezas a perder precisión."],cen:["en el centro","Tu mejor rendimiento llega con una excitación intermedia: despierto y con algo de presión útil."],der:["a la derecha","Necesitas más excitación para dar lo mejor. Con poca presión tiendes a quedarte corto."]}[pos];
    const zlo=Math.max(1,peak-.5),zhi=Math.min(5,peak+.5),pc=v=>((v-1)/4*100).toFixed(1);
    const sc=(mk)=>`<div class="pk-s"><i style="left:${pc(zlo)}%;width:${((zhi-zlo)/4*100).toFixed(1)}%"></i>${mk}</div><div class="pk-sl"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>`;
    const stT=st==="low"?["Por debajo de tu pico","var(--ac)"]:st==="high"?["Por encima de tu pico","var(--org)"]:["Dentro de tu zona","var(--grn)"];
    h+=`<div class="pk-g"><div class="pk-c"><div class="eyebrow m"><i style="background:var(--ac)"></i>Tu curva está</div><div class="pk-t">${cap(tx[0])}</div><p>${tx[1]}</p></div>
    <div class="pk-o" role="group" aria-label="Tu pico estimado"><div class="pk-l">Tu pico estimado</div><div class="pk-big"><b class="tab">${peak.toFixed(1)}</b><span>Nivel · ${nm}</span></div><div class="pk-z tab">Tu zona ideal va de ${zlo.toFixed(1)} a ${zhi.toFixed(1)}</div>${sc("")}<p>${fit?"La curva se calculó con tus "+n+" registros.":"Es una estimación provisional con el nivel de mejor promedio. "}${!fit&&(n<8||nl<3)?`Llevas ${n} registros en ${nl} nivel${nl===1?"":"es"}; mejora con más.`:""}</p></div>`;
    if(st)h+=`<div class="pk-c"><div class="eyebrow m"><i style="background:${stT[1]}"></i>Tus últimos 5 bloques</div><div class="pk-t tab">Excitación ${ra.toFixed(1)}</div><span class="stc"><i style="background:${stT[1]}"></i>${stT[0]}</span>${sc(`<em style="left:${pc(Math.max(1,Math.min(5,ra)))}%"></em>`)}<p>${st==="low"?"Te conviene subirla antes de empezar un bloque exigente.":st==="high"?"Te conviene bajarla antes de empezar un bloque exigente.":"Mantén lo que estás haciendo."}</p></div>`;
    h+=`</div>`;
  }
  let lv="";for(let i=1;i<=5;i++){const a=byA[i]||[];lv+=`<div class="bar w ${a.length&&a.length<3?"low":""}"><span class="nm">${i} · ${AR[i].s}</span><div class="trk"><i class="one" style="width:${a.length?mean(a)/3*100:0}%${a.length?`;background:var(--lv${Math.round(mean(a))})`:""}"></i></div><span class="v tab">${a.length?f1(mean(a)):"–"} <small>n=${a.length}</small></span></div>`}
  h+=secH("Datos","Rendimiento en cada nivel","Promedio de rendimiento (de 1 a 3) en los bloques donde marcaste ese nivel de excitación.")+`<div class="card" style="margin-top:14px">${lv}</div>`;
  h+=secH("Ajustar","Cómo mover tu excitación")+`<button type="button" class="hbtn" data-a="arz" style="margin-top:14px">${ic.sl}<span class="tx"><span class="t">Mueve o ajusta tu excitación</span><span class="s">${st==="low"?"Ahora te conviene subirla.":st==="high"?"Ahora te conviene bajarla.":"Te digo qué hacer para subirla o bajarla."}</span></span>${ic.chr.replace("<svg ",'<svg style="width:22px;height:22px" ')}</button>`;
  h+=`<p class="sm mut" style="margin-top:14px">La curva de referencia es un modelo general. La tuya sale de lo que tú registras, así que depende de qué tan honesto y constante seas al marcar cada bloque.</p>`;
  return h;
}

  /* calendario por bloques */
  h+=secH("Calendario","Tu rendimiento en cada bloque","Cada cuadro es un bloque de ese día. La letra es el nivel: B de Bajo, A de Alto y M de Máximo. Toca un día para ver qué hiciste.");
  h+=`<div class="card" style="margin-top:14px"><div class="wg"><span></span>${wd.map(d=>`<span class="hc">${DN[wdOf(d)]}<br>${+d.slice(8)}</span>`).join("")}${Array.from({length:Math.max(...wd.map(d=>bl(d).length))},(_,i)=>`<span class="hr">B${i+1}</span>`+wd.map(d=>{if(i>=bl(d).length)return`<span class="wcell n"></span>`;const r=logs[id(d,i)];return r&&r.lv>=1&&r.lv<=3?`<span class="wcell l${r.lv}" title="${rtxt(r,d,i)} · ${esc(r.act||"Sin actividad")}">${L[r.lv].n.charAt(0)}</span>`:`<span class="wcell" title="${rngD(d,i)}">·</span>`}).join("")).join("")}</div></div>`;
  if(R.length){
    const kb={};R.forEach(r=>{const x=rinfo(r);if(!x)return;const k=x.v+"|"+x.bk;(kb[k]=kb[k]||{x,a:[]}).a.push(r.lv)});
    const kl=Object.values(kb).sort((p,q)=>p.x.sm-q.x.sm||p.x.em-q.x.em),vs=new Set(kl.map(o=>o.x.v)),vn=v=>allV().findIndex(z=>z.id===v)+1;
    if(kl.length)h+=`<div class="card" style="margin-top:12px"><div class="eyebrow m">Cómo se reparte cada bloque</div><p class="sm mut" style="margin-top:6px">Qué parte de cada bloque fue Bajo, Alto o Máximo esta semana. A la derecha, el promedio.${vs.size>1?" Los bloques se separan por versión del horario; no se mezclan aunque tengan el mismo número.":""}</p><div class="leg">${[1,2,3].map(n=>`<span><i style="background:var(--lv${n})"></i>${L[n].n}</span>`).join("")}</div>${kl.map(({x,a})=>`<div class="bar w"><span class="nm" title="${x.s} – ${x.e}${vs.size>1?" · horario "+vn(x.v):""}">${x.s}–${x.e}${vs.size>1?" · H"+vn(x.v):""}</span><div class="trk">${[1,2,3].map(n=>{const c=a.filter(z=>z===n).length;return c?`<i style="width:${c/a.length*100}%;background:var(--lv${n})" title="${L[n].n}: ${c}"></i>`:""}).join("")}</div><span class="v tab">${f1(mean(a))}</span></div>`).join("")}</div>`;
  }
  wd.forEach(d=>{
    if(d>today)return;
    const rows=bl(d).map((_,i)=>({i,r:logs[id(d,i)]})),c=rows.filter(o=>o.r&&o.r.lv>=1&&o.r.lv<=3).length+extras(d).filter(o=>o.r.lv>=1&&o.r.lv<=3).length;
    if(!c){h+=`<div class="dd empty-d"><div class="row"><b style="font-weight:800">${longDate(d)}</b><span class="chip">Sin registros</span></div></div>`;return}
    const o=!!wkOpen[d];
    h+=`<section class="dd"><button type="button" class="dacc${o?" o":""}" data-a="wkd" data-d="${d}" aria-expanded="${o}"><span class="t"><h3>${longDate(d)}</h3><span class="sub tab">${c} de ${rows.length} bloques registrados</span></span><span class="ps" aria-hidden="true">${rows.map(({r})=>`<i class="${r&&r.lv>=1&&r.lv<=3?"l"+r.lv:""}"></i>`).join("")}</span>${ic.chr}</button>${o?rows.map(({i,r})=>r&&r.lv>=1&&r.lv<=3?`<div class="dr"><span class="bn l${r.lv}">${i+1}</span><div class="tx"><b>${esc(r.act||"Sin actividad")}</b><span class="tab">${rtxt(r,d,i)}${r.ar?" · "+AR[r.ar].s:""}</span></div>${pill(r.lv)}</div>`:`<div class="dr no"><span class="bn">${i+1}</span><div class="tx"><b>${r&&r.sk?"No trabajé":"Sin registro"}</b><span class="tab">${rtxt(r,d,i)}${r&&r.sk&&r.why?" · "+esc(r.why):""}</span></div></div>`).join("")+extraRows(extras(d),false):""}</section>`;
  });
  return h;
}

/* ---------- Historial (calendario) ---------- */
function histBtn(){
  const R=recs(),n=R.length,d=new Set(R.map(r=>r.date)).size;
  return`<button type="button" class="hbtn" data-a="calopen" aria-label="Revisar el historial">${ic.cal}<span class="tx"><span class="t">Revisar el historial</span><span class="s">${n?`${n} registro${n>1?"s":""} en ${d} día${d>1?"s":""}. Míralos en un calendario.`:"Aquí verás tus días en un calendario."}</span></span>${ic.chr.replace("<svg ",'<svg style="width:22px;height:22px" ')}</button>`;
}
function calHtml(){
  const[y,mo]=sheet.m.split("-").map(Number),today=dk(new Date()),curM=today.slice(0,7);
  const by={};recs().forEach(r=>{(by[r.date]=by[r.date]||[]).push(r)});
  const first=new Date(y,mo-1,1),lead=(first.getDay()+6)%7,nd=new Date(y,mo,0).getDate();
  const title=cap(first.toLocaleDateString("es-CO",{month:"long",year:"numeric"}));
  let mr=0,md=0,sum=0,hd=0;
  for(let i=1;i<=nd;i++){const d=sheet.m+"-"+pad(i),x=by[d];if(x){const v=x.map(r=>r.lv);mr+=v.length;md++;sum+=v.reduce((p,q)=>p+q,0)}
    const hv=habs[d];if(hv&&HAB.some(k=>hv[k.k]!==undefined))hd++}
  let g="";
  for(let i=0;i<lead;i++)g+=`<span class="cd out" aria-hidden="true"></span>`;
  for(let i=1;i<=nd;i++){
    const d=sheet.m+"-"+pad(i),x=by[d]||[],c=x.length,hv=habs[d],hh=hv&&HAB.some(k=>hv[k.k]!==undefined),fut=d>today;
    g+=`<button type="button" class="cd${c?" has":""}${d===today?" td":""}${d===sheet.sel?" sel":""}${fut?" fut":""}" data-a="calsel" data-d="${d}" ${fut?"disabled":""} aria-pressed="${d===sheet.sel}" aria-label="${longDate(d)}: ${c} de ${bl(d).length} registros">${hh?'<i class="hb"></i>':""}<span class="dn">${i}</span><span class="ps">${bl(d).map((_,b)=>{const r=logs[id(d,b)];return`<i class="${r&&r.lv>=1?"l"+r.lv:""}"></i>`}).join("")+extras(d).filter(o=>o.r.lv>=1&&o.r.lv<=3).map(o=>`<i class="l${o.r.lv}"></i>`).join("")}</span><span class="ct">${c?c+"/"+bl(d).length:"–"}</span></button>`;
  }
  let h=`<div class="row"><div><div class="eyebrow">Historial</div><h2 class="h2">Tu calendario</h2></div><button type="button" class="btn sm" data-a="close">Listo</button></div>
  <div class="cal-h"><button type="button" class="cal-n" data-a="calnav" data-v="-1" aria-label="Mes anterior">${ic.chl}</button><b>${title}</b><button type="button" class="cal-n" data-a="calnav" data-v="1" aria-label="Mes siguiente" ${sheet.m>=curM?"disabled":""}>${ic.chr}</button></div>
  <div class="cal-w" aria-hidden="true">${["L","M","M","J","V","S","D"].map(l=>`<span>${l}</span>`).join("")}</div>
  <div class="cal-g">${g}</div>
  <div class="leg">${[1,2,3].map(n=>`<span><i style="background:var(--lv${n})"></i>${L[n].n}</span>`).join("")}<span><i style="background:var(--line)"></i>Sin registro</span></div>
  <p class="sm mut" style="margin-top:8px">Cada barrita es un bloque de ese día. Abajo ves cuántos registraste. El punto azul marca que respondiste hábitos.</p>
  <div class="msum"><div><b class="tab">${mr}</b><span>registros</span></div><div><b class="tab">${md}</b><span>día${md===1?"":"s"} con datos</span></div><div><b class="tab">${md?f1(sum/mr):"–"}</b><span>promedio de 3</span></div></div>`;
  if(!sheet.sel)return h+`<div class="empty" style="margin-top:18px;padding:24px 16px"><b>Toca un día</b>Verás qué registraste en cada bloque.</div>`;
  const d=sheet.sel,x=by[d]||[],c=x.length,hv=habs[d]||{};
  h+=`<section class="dd" aria-label="Detalle del día"><h3>${longDate(d)}</h3><div class="sub tab">${c} de ${bl(d).length} bloques registrados</div>`;
  if(HAB.some(k=>hv[k.k]!==undefined))h+=`<div class="dh" aria-label="Hábitos del día">${HAB.map(k=>`<span><i class="${hv[k.k]===1?"y":hv[k.k]===0?"n":"z"}">${hv[k.k]===1?ic.ok:hv[k.k]===0?ic.no:""}</i>${k.n}</span>`).join("")}</div>`;
  bl(d).forEach((_,i)=>{
    const r=logs[id(d,i)],k=id(d,i);
    if(r&&r.lv>=1&&r.lv<=3)h+=`<div class="dr"><span class="bn l${r.lv}">${i+1}</span><div class="tx"><b><span class="pill l${r.lv}" style="margin-right:8px">${L[r.lv].n}</span><span class="tab" style="display:inline;font-weight:600;color:var(--mut);font-size:12px">${rtxt(r,d,i)}</span></b><span>${meta(r)}</span></div><button class="del" type="button" data-a="del" data-k="${k}">${armed===k?"¿Seguro?":"Eliminar"}</button></div>`;
    else h+=`<div class="dr no"><span class="bn">${i+1}</span><div class="tx"><b>${r&&r.sk?"No trabajé":"Sin registro"}</b><span class="tab">${rtxt(r,d,i)}${r&&r.sk&&r.why?" · "+esc(r.why):""}</span></div></div>`;
  });
  h+=extraRows(extras(d),true);
  return h+`</section>`;
}

function render(){
  let fk=null;{const a=document.activeElement;if(tab==="pl"&&a&&a.closest&&a.closest("#app")&&(a.id==="plg"||(a.classList&&a.classList.contains("plnote")))){fk={id:a.id,b:a.dataset&&a.dataset.b,s:a.selectionStart,e:a.selectionEnd}}}
  $("#app").innerHTML=tab==="hoy"?hoy():tab==="se"?se():tab==="an"?an():tab==="pl"?plan():foc();
  $("#nav").firstElementChild.innerHTML=NAV.map(([k,n,p])=>`<button type="button" class="${tab===k?"on":""}" data-a="tab" data-v="${k}" aria-label="${n}" title="${n}" ${tab===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg></button>`).join("");
  if(fk){const el=fk.id==="plg"?$("#plg"):document.querySelector('.plnote[data-b="'+fk.b+'"]');if(el){try{el.focus({preventScroll:true});el.setSelectionRange(fk.s,fk.e)}catch(x){}}}
  syncSw();if(sheet&&sheet.t==="cal")renderSheet();
}
setInterval(()=>{renderTop();if(tab==="hoy"&&!sheet)render()},30000);
init();
</script>
